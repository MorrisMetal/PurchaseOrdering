<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morris Metals · Purchasing (Microsoft 365)</title>
<style>
:root{
  --paper:#F4F6F9; --surface:#FFFFFF; --ink:#152238; --muted:#5A6779; --line:#D8DEE7; --line-soft:#E9EDF2;
  --tint:#EAF0F8; --brand:#1D4F91; --brand-hover:#163F75; --brand-ink:#FFFFFF;
  --carbon:#FFFBE6; --carbon-line:#E8DFB0;
  --ok:#1C7A4A; --ok-bg:#E3F3EA; --warn:#9A5B00; --warn-bg:#FCF0DC; --bad:#B42318; --bad-bg:#FCE8E6;
  --info:#1D4F91; --info-bg:#E4ECF8; --neutral:#5F6B7A; --neutral-bg:#EEF1F4;
  --shadow:0 1px 2px rgba(21,34,56,.06),0 8px 24px rgba(21,34,56,.08);
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1622; --surface:#16202F; --ink:#E6ECF4; --muted:#9AA7B8; --line:#2A3749; --line-soft:#223042;
    --tint:#1B2A40; --brand:#6EA2E8; --brand-hover:#8DB6EE; --brand-ink:#0F1622;
    --carbon:#2A2717; --carbon-line:#4A4428;
    --ok:#5BC48C; --ok-bg:#16301F; --warn:#E6A84B; --warn-bg:#352611; --bad:#F2877D; --bad-bg:#3A1A17;
    --info:#7FAEEC; --info-bg:#1A2A44; --neutral:#A3AEBC; --neutral-bg:#222D3C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1622; --surface:#16202F; --ink:#E6ECF4; --muted:#9AA7B8; --line:#2A3749; --line-soft:#223042;
  --tint:#1B2A40; --brand:#6EA2E8; --brand-hover:#8DB6EE; --brand-ink:#0F1622;
  --carbon:#2A2717; --carbon-line:#4A4428;
  --ok:#5BC48C; --ok-bg:#16301F; --warn:#E6A84B; --warn-bg:#352611; --bad:#F2877D; --bad-bg:#3A1A17;
  --info:#7FAEEC; --info-bg:#1A2A44; --neutral:#A3AEBC; --neutral-bg:#222D3C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
img{max-width:100%}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.brand-name{font-weight:700;font-size:15px;line-height:1.2}
.brand-sub{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:6px 10px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--tint);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--tint);color:var(--brand);font-weight:650}
.nav .count{font-size:12px;background:var(--warn-bg);color:var(--warn);padding:1px 8px;border-radius:99px;font-weight:650}
.side-foot{margin-top:auto;padding-bottom:4px;font-size:12px;color:var(--muted);padding:0 8px;line-height:1.45}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* Main */
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:750;letter-spacing:-.01em}
.lede{color:var(--muted);margin:4px 0 0;font-size:14px}
h2{font-size:16px;margin:0 0 12px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--brand)}
.kpi .v{font-size:24px;font-weight:750;line-height:1.2}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.alert .v{color:var(--warn)}
/* Table */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--tint)}
.num{text-align:right;white-space:nowrap}
.mono-id{font-weight:650;white-space:nowrap}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;max-width:360px;padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.list{display:flex;flex-direction:column}
.list-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.list-item:last-child{border-bottom:0}
.list-item button.link{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink);font-weight:600}
.list-item button.link:hover{color:var(--brand);text-decoration:underline}
.bar{height:8px;background:var(--line-soft);border-radius:99px;overflow:hidden;position:relative}
.bar span{position:absolute;inset:0 auto 0 0;border-radius:99px}
.budget-row{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.budget-row:last-child{border-bottom:0}
.budget-row .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:14px}
.banner{padding:10px 14px;border-radius:8px;background:var(--info-bg);color:var(--info);font-size:14px;margin-bottom:16px}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,30,.42);z-index:40;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--paper);z-index:41;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-body{overflow-y:auto;padding:20px;flex:1}
.drawer-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface)}
/* The purchase order sheet */
.sheet{background:var(--carbon);border:1px solid var(--carbon-line);border-radius:4px;padding:26px 26px 22px;position:relative;box-shadow:0 1px 0 var(--carbon-line),0 3px 0 -1px var(--surface),0 4px 0 -1px var(--carbon-line)}
.sheet-top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px}
.sheet h3{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em}
.sheet .po-no{font-size:15px;font-weight:650}
.sheet-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px;margin-bottom:18px;font-size:14px}
.sheet-meta .k{font-size:12px;color:var(--muted);margin-bottom:2px}
.sheet table{font-size:14px}
.sheet th{background:transparent;border-bottom:1px solid var(--ink);padding:8px 8px;color:var(--ink)}
.sheet td{padding:8px 8px;border-bottom:1px dashed var(--carbon-line)}
.sheet .totals{margin-left:auto;width:min(280px,100%);margin-top:12px;font-size:14px}
.sheet .totals div{display:flex;justify-content:space-between;padding:3px 0}
.sheet .totals .grand{border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-weight:800;font-size:17px}
.stamp{position:absolute;top:22px;right:26px;transform:rotate(-8deg);border:3px solid currentColor;border-radius:6px;padding:4px 12px;font-weight:800;font-size:17px;letter-spacing:.08em;text-transform:uppercase;opacity:.82;pointer-events:none;background:transparent;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stamp{mix-blend-mode:normal}}
:root[data-theme="dark"] .stamp{mix-blend-mode:normal}
.stamp.pop{animation:stamp .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.8);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.82}}
@media (prefers-reduced-motion:reduce){.stamp.pop{animation:none}.drawer{transition:none}}
.section{margin-top:18px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 12px 20px;font-size:14px}
.timeline li::before{content:"";position:absolute;left:4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.timeline li::after{content:"";position:absolute;left:7px;top:16px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--bad);padding:8px 12px;border-radius:6px;font-size:14px;margin-top:4px}
.match{display:flex;gap:10px;flex-wrap:wrap}
.match > div{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.match .k{font-size:12px;color:var(--muted)}
.match .v{font-weight:700;font-size:16px}
/* Modal */
.modal-scrim{position:fixed;inset:0;background:rgba(10,18,30,.5);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.narrow{width:min(460px,100%)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{margin:0}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea,.lines input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:400;font-size:14px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.field .hint{font-weight:400;color:var(--muted);font-size:12px}
.lines{width:100%;border-collapse:collapse;margin-top:6px}
.lines th{padding:6px 6px;font-size:12px;border-bottom:1px solid var(--line)}
.lines td{padding:5px 6px;border:0}
.lines input{padding:7px 8px}
.form-totals{display:flex;justify-content:flex-end;gap:22px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
.form-totals b{color:var(--ink)}
.err{color:var(--bad);font-size:13px;margin-top:10px}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px;font-size:18px;line-height:1}
.icon-btn:hover{background:var(--tint);color:var(--ink)}
.link-btn{background:none;border:0;padding:0;cursor:pointer;color:var(--brand);font-weight:600;text-align:left}
.link-btn:hover{text-decoration:underline}
.qty-pos{color:var(--ok);font-weight:650}.qty-neg{color:var(--bad);font-weight:650}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.site{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.site:hover{border-color:var(--brand)}
.site-name{font-weight:700;font-size:16px}
.site-v{font-size:22px;font-weight:750;margin:4px 0}
[hidden]{display:none!important}
.live-bar{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--surface)}
.live-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:livepulse 2s infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(28,122,74,.45)}70%{box-shadow:0 0 0 7px rgba(28,122,74,0)}100%{box-shadow:0 0 0 0 rgba(28,122,74,0)}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
.peers{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.peer{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--tint);color:var(--brand);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.peer.is-me{background:var(--brand);color:var(--brand-ink)}
.peer-where{margin-top:6px;line-height:1.4}
.share-steps{margin:8px 0 10px;padding-left:20px;font-size:14px;line-height:1.6}
.part-desc{font-size:13px;line-height:1.45;color:var(--ink);max-width:560px;white-space:normal}
.tag.warnt{background:var(--warn-bg);color:var(--warn);font-weight:600}
td.ind2.hire-veh{min-width:170px;padding-left:34px}
.no-stock .stock-only{display:none!important}
.nav-group{font-size:11.5px;font-weight:700;color:var(--muted);padding:14px 10px 4px}
.signin{display:grid;place-items:center;min-height:70vh}.signin .panel{width:min(440px,100%)}
.bid-best{background:var(--ok-bg)}.bid-won{box-shadow:inset 0 0 0 2px var(--ok)}
button.no-perm{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--ink);font-size:12.5px;margin:2px 4px 2px 0;border:0;font-weight:500;white-space:nowrap}
.tag.hit{background:var(--warn-bg);color:var(--warn);font-weight:700}
.tag.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
.tag-btn{cursor:pointer}.tag-btn:hover{background:var(--brand);color:var(--brand-ink)}
.side-search{width:100%;max-width:none;min-width:0;flex:none;font-size:14px;padding:7px 10px}
.explore-input{max-width:none;width:100%;font-size:16px;padding:12px 14px}
.x-sec h2{display:flex;gap:8px;align-items:baseline}
.lines select{padding:7px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px;width:100%}
a.btn{text-decoration:none;color:inherit}a.btn.primary{color:var(--brand-ink)}a.btn.disabled{opacity:.5;pointer-events:none}
.matrix tbody td:first-child,td.ind1,td.ind2{min-width:220px}
.plant-title{font-size:inherit;font-weight:inherit;color:var(--ink)}
.plant-title:hover{color:var(--brand)}
fieldset.field{border:0;padding:0;margin:0;min-width:0}
fieldset.field legend{padding:0;margin-bottom:6px;font-size:13px;font-weight:600}
.checks{display:flex;gap:8px 18px;flex-wrap:wrap}
.check{display:inline-flex;gap:6px;align-items:center;font-weight:400;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--brand)}
.chip-n{opacity:.7;margin-left:3px;font-size:12px}
.site-group{margin-bottom:28px}
.site-group-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--brand)}
.site-group-head h2{margin:0;font-size:19px}
.site-group-head .btn{margin-left:auto}
th.col-hl{color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
td.col-hl{box-shadow:inset 2px 0 0 var(--brand),inset -2px 0 0 var(--brand);font-weight:700}
.grp-plant td{background:var(--tint);border-top:2px solid var(--brand);border-bottom:1px solid var(--line);padding:10px 14px}
.grp-plant-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp-toggle{background:none;border:0;padding:0;cursor:pointer;font-weight:800;font-size:16px;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.grp-toggle .caret{color:var(--brand);width:12px;display:inline-block}
.grp-right{margin-left:auto;font-weight:700}
.grp-comp td{padding:8px 14px 6px 34px;border-bottom:1px solid var(--line-soft);background:var(--surface)}
.grp-comp-name{font-weight:700;color:var(--brand)}
.grp-add{float:right;padding:2px 8px;font-size:12.5px}
td.ind1{padding-left:34px}
td.ind2{padding-left:52px}
.cell-zero{color:var(--bad);background:var(--bad-bg)}
table tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0;background:var(--tint)}
.matrix td.num,.matrix th.num{min-width:90px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);z-index:20;gap:10px;top:env(safe-area-inset-top,0px)}
  .brand-sub,.side-foot,.side-search,.nav-group,.live-bar{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;flex:1}
  .nav button{width:auto;white-space:nowrap;padding:7px 10px}
  main{padding-top:20px}
  .sheet{padding:18px 14px}
  .stamp{top:14px;right:14px;font-size:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" id="brandMark" aria-hidden="true">MM</div>
      <div><div class="brand-name" id="brandName">Purchasing</div><div class="brand-sub" id="brandSub">Morris Metals · Purchasing</div></div>
    </div>

/* ---------------- Summary columns written alongside each record, so the SharePoint list is readable and usable in Power Automate and Power BI ---------------- */
function poTotal(d){ const sub = (d.lines||[]).reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0); return Math.round((sub + sub*(+d.taxRate||0)/100 + (+d.shipping||0))*100)/100; }
function cols(path, d){
  const col = path.split("/")[0];
  const ref = col==="pos" ? d.number : col==="items" ? `${d.sku||""} ${d.name||""}`.trim() : (d.name || d.title || d.ref || d.code || d.fleetNo || "");
  const amount = col==="pos" ? poTotal(d) : col==="hires" ? (+d.rate||0) : col==="depts" ? (+d.budget||0) : col==="items" ? (+d.cost||0) : null;
  const summary = col==="pos" ? `${d.number||""} · ${d.status||""} · £${poTotal(d).toFixed(2)}` : col==="hires" ? `${d.fleetNo||""} ${d.make||""} ${d.model||""} · ${d.status==="off"?"off hire":"on hire"}` : col==="presence" ? `${d.person||d.email||""} · ${d.view||""}` : String(ref||"");
  return { Ref:String(ref||"").slice(0,255), Status:String(d.status||"").slice(0,255), Summary:summary.slice(0,255), Amount:amount };
}

/* ---------------- Back ends: Microsoft Graph (SharePoint list) and an in-browser demo ---------------- */
async function msToken(){
  const req = { scopes:SCOPES, account };
  try { return (await msalApp.acquireTokenSilent(req)).accessToken; }
  catch(e){ await msalApp.acquireTokenRedirect(req); throw e; }
}
async function gfetch(url, opt){
  opt = opt || {};
  for(let attempt = 0; attempt < 5; attempt++){
    const t = await msToken();
    const r = await fetch(url.startsWith("http") ? url : G + url, Object.assign({}, opt, { headers: Object.assign({ Authorization:"Bearer " + t, "Content-Type":"application/json" }, opt.headers||{}) }));
    if(r.status === 429 || r.status === 503 || r.status === 504){ await sleep((+(r.headers.get("Retry-After")||0) || (1 + attempt*2)) * 1000); continue; }
    if(!r.ok){ let body = ""; try { body = await r.text(); } catch(e){} const err = new Error(`Microsoft Graph ${r.status}: ${body.slice(0,400)}`); err.status = r.status; err.code = (r.status===401||r.status===403) ? "permission-denied" : r.status>=500 ? "unavailable" : "graph-error"; throw err; }
    return r.status === 204 ? null : r.json();
  }
  const e = new Error("Microsoft 365 is busy. Try again in a moment."); e.code = "unavailable"; throw e;
}
const graphBackend = {
  async connect(){
    const u = new URL(cfg.siteUrl.trim());
    const site = await gfetch(`/sites/${u.hostname}:${u.pathname.replace(/\/+$/,"") || "/"}?$select=id,displayName`);
    siteId = site.id;
    const lists = await gfetch(`/sites/${siteId}/lists?$select=id,displayName&$top=999`);
    const found = (lists.value||[]).find(l => l.displayName === LIST);
    if(found) listId = found.id;
    else {
      const created = await gfetch(`/sites/${siteId}/lists`, { method:"POST", body: JSON.stringify({ displayName:LIST, list:{ template:"genericList" }, columns:[
        { name:"Collection", text:{}, indexed:true }, { name:"DocId", text:{} }, { name:"Ref", text:{} }, { name:"Status", text:{} }, { name:"Amount", number:{} },
        { name:"Summary", text:{} }, { name:"Body", text:{ allowMultipleLines:true, textType:"plain", linesForEditing:6 } }, { name:"Deleted", boolean:{} } ] }) });
      listId = created.id;
    }
  },
  async pull(since){
    const base = `/sites/${siteId}/lists/${listId}/items?$expand=fields($select=Title,Body,Deleted)&$select=id,lastModifiedDateTime&$top=999`;
    let url = since ? base + `&$filter=fields/Modified gt '${since}'` : base, out = [];
    while(url){ const r = await gfetch(url, since ? { headers:{ Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly" } } : {}); (r.value||[]).forEach(it => out.push({ id:it.id, modified:it.lastModifiedDateTime, path:(it.fields||{}).Title, body:(it.fields||{}).Body, deleted:!!(it.fields||{}).Deleted })); url = r["@odata.nextLink"]; }
    return out;
  },
  async write(path, data, itemId){
    const [col] = path.split("/"), body = data == null ? "" : JSON.stringify(data);
    if(body.length > 60000) { const e = new Error("This record is too large to save."); e.code = "resource_exhausted"; throw e; }
    const f = Object.assign({ Title:path, Collection:col, DocId:path.slice(col.length+1), Body:body, Deleted: data == null }, data == null ? {} : cols(path, data));
    if(f.Amount == null) delete f.Amount;
    if(itemId){ await gfetch(`/sites/${siteId}/lists/${listId}/items/${itemId}/fields`, { method:"PATCH", body:JSON.stringify(f) }); return itemId; }
    const r = await gfetch(`/sites/${siteId}/lists/${listId}/items`, { method:"POST", body:JSON.stringify({ fields:f }) });
    return r.id;
  },
  async writeMany(entries){
    for(let i = 0; i < entries.length; i += 20){
      const chunk = entries.slice(i, i+20);
      const reqs = chunk.map(([path, data], k) => { const col = path.split("/")[0]; const f = Object.assign({ Title:path, Collection:col, DocId:path.slice(col.length+1), Body:JSON.stringify(data), Deleted:false }, cols(path, data)); if(f.Amount == null) delete f.Amount; return { id:String(k+1), method:"POST", url:`/sites/${siteId}/lists/${listId}/items`, headers:{ "Content-Type":"application/json" }, body:{ fields:f } }; });
      const r = await gfetch(`/$batch`, { method:"POST", body:JSON.stringify({ requests:reqs }) });
      const bad = (r.responses||[]).filter(x => x.status >= 300);
      if(bad.length){ const e = new Error(`Setup could not save ${bad.length} records: ` + JSON.stringify(bad[0].body||{}).slice(0,300)); e.code = bad[0].status===403 ? "permission-denied" : "graph-error"; throw e; }
    }
  }
};

/* ---------------- Sync engine with a Firestore-style interface the purchasing app already uses ---------------- */
const STORE = {}, REMOTE = {}, ITEMID = {}, MOD = {}; let WATERMARK = "", syncing = false, firstLoadDone = false;
const LISTENERS = [];
function colDocs(col, o){
  let rows = Object.keys(STORE).filter(p => p.startsWith(col + "/") && p.split("/").length === 2).map(p => ({ id:p.slice(col.length+1), v:STORE[p] }));
  if(o && o.order){ const [f, dir] = o.order; rows.sort((a,b) => String(a.v[f]||"").localeCompare(String(b.v[f]||"")) * (dir==="desc" ? -1 : 1)); }
  if(o && o.limit) rows = rows.slice(0, o.limit);
  return { docs: rows.map(r => ({ id:r.id, exists:true, data:() => clone(r.v) })) };
}
function docSnap(path){ const v = STORE[path]; return { id:path.split("/").pop(), exists: v !== undefined, data: () => clone(v) }; }
function notify(cols, docs){ LISTENERS.forEach(l => { if(l.kind==="col" ? cols.has(l.col) : docs.has(l.path)) { try { l.kind==="col" ? l.fn(colDocs(l.col, l.o)) : l.fn(docSnap(l.path)); } catch(e){ console.error(e); } } }); }
function applyRemote(items){
  const cols = new Set(), docs = new Set();
  items.forEach(it => {
    if(!it.path) return;
    if(MOD[it.path] && it.modified < MOD[it.path]) return;
    MOD[it.path] = it.modified; ITEMID[it.path] = it.id;
    if(it.modified > WATERMARK) WATERMARK = it.modified;
    let v; if(!it.deleted && it.body){ try { v = JSON.parse(it.body); } catch(e){ return; } }
    const before = JSON.stringify(STORE[it.path]);
    REMOTE[it.path] = v;
    if(PENDING[it.path]) return;
    if(v === undefined) delete STORE[it.path]; else STORE[it.path] = v;
    if(before !== JSON.stringify(v)){ cols.add(it.path.split("/")[0]); docs.add(it.path); }
  });
  if(cols.size) notify(cols, docs);
}
const PENDING = {};
async function sync(full){
  if(syncing) return; syncing = true;
  try {
    const since = (!full && WATERMARK) ? new Date(Date.parse(WATERMARK) - 3000).toISOString().replace(/\.\d{3}Z$/,"Z") : "";
    let items;
    try { items = await backend.pull(since); } catch(e){ if(since && e.status === 400) items = await backend.pull(""); else throw e; }
    applyRemote(items);
    firstLoadDone = true; setStatus("");
  } catch(e){ setStatus(e.code === "permission-denied" ? "You don't have access to the Purchasing site. Ask IT to add you as a Member." : "Can't reach Microsoft 365 right now. Retrying…"); }
  finally { syncing = false; }
}
let statusEl = null;
function setStatus(t){ if(!statusEl){ statusEl = document.createElement("div"); statusEl.className = "toast"; statusEl.style.bottom = "64px"; document.body.appendChild(statusEl); } statusEl.textContent = t; statusEl.style.display = t ? "" : "none"; }
async function writeDoc(path, data){
  const prev = STORE[path];
  if(data === null) delete STORE[path]; else STORE[path] = clone(data);
  PENDING[path] = (PENDING[path]||0) + 1;
  notify(new Set([path.split("/")[0]]), new Set([path]));
  try { const id = await backend.write(path, data, ITEMID[path]); ITEMID[path] = id; }
  catch(e){ if(prev === undefined) delete STORE[path]; else STORE[path] = prev; notify(new Set([path.split("/")[0]]), new Set([path])); throw e; }
  finally { PENDING[path]--; if(!PENDING[path]) delete PENDING[path]; }
}
function docRef(path){ return { path, set: (v) => writeDoc(path, JSON.parse(JSON.stringify(v))), delete: () => writeDoc(path, null), get: async () => docSnap(path),
  onSnapshot(fn, err){ const l = { kind:"doc", path, fn, err }; LISTENERS.push(l); setTimeout(() => fn(docSnap(path)), 0); return () => { const i = LISTENERS.indexOf(l); if(i>=0) LISTENERS.splice(i,1); }; } }; }
function colRef(col, o){ o = o || {}; return { doc:(id) => docRef(col + "/" + id), orderBy:(f, dir) => colRef(col, Object.assign({}, o, { order:[f, dir] })), limit:(n) => colRef(col, Object.assign({}, o, { limit:n })),
  onSnapshot(fn, err){ const l = { kind:"col", col, o, fn, err }; LISTENERS.push(l); setTimeout(() => fn(colDocs(col, o)), 0); return () => { const i = LISTENERS.indexOf(l); if(i>=0) LISTENERS.splice(i,1); }; } }; }
const DB = { collection:(c) => colRef(c), doc:(p) => docRef(p) };

/* ---------------- Presence, user and downloads adapters ---------------- */
let me = { uid:"", name:"", email:"" }, ROOM = null, USER = null;
function makeRoom(){
  let pres = {}, timer = null;
  const write = () => writeDoc("presence/" + me.uid, Object.assign({}, pres, { at:new Date().toISOString(), email:me.email, name:me.name })).catch(()=>{});
  window.addEventListener("pagehide", () => { try { backend.write("presence/" + me.uid, null, ITEMID["presence/" + me.uid]); } catch(e){} });
  return {
    presence: async (patch) => { Object.entries(patch||{}).forEach(([k,v]) => { if(v === null) delete pres[k]; else pres[k] = v; }); write(); if(!timer) timer = setInterval(write, 30000); },
    onPeers: (fn) => {
      const emit = () => { const now = Date.now(); const peers = Object.keys(STORE).filter(p => p.startsWith("presence/")).map(p => Object.assign({ id:p.slice(9) }, STORE[p])).filter(d => now - Date.parse(d.at||0) < 90000).map(d => ({ peer:d.id, by:d.id, isMe:d.id===me.uid, sameTab:d.id===me.uid, kind:"viewer", guest:false, presence:d, updatedAt:Date.parse(d.at||0) })); fn({ peers, joined:[], left:[], updated:[] }); };
      const l = { kind:"col", col:"presence", o:{}, fn:emit }; LISTENERS.push(l); emit(); const t = setInterval(emit, 30000);
      return () => { clearInterval(t); const i = LISTENERS.indexOf(l); if(i>=0) LISTENERS.splice(i,1); };
    }
  };
}
function makeUser(){
  return { id: async () => me.uid, me: async () => ({ id:me.uid, name:me.name }), can: async () => true, canEdit: async () => true, isOwner: async () => false,
    profiles: async (ids) => Object.fromEntries((ids||[]).map(id => { const p = STORE["presence/" + id] || STORE["logins/" + id]; return [id, { name: p ? (p.name || p.email || "") : "" }]; })) };
}
const DOWNLOADS = { save: async ({ filename, data }) => { const type = /\.csv$/i.test(filename) ? "text/csv" : /\.json$/i.test(filename) ? "application/json" : "text/html"; const url = URL.createObjectURL(new Blob([data], { type: type + ";charset=utf-8" })); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000); } };
window.claude = { use: async (name) => { await ready; if(name==="db") return DB; if(name==="room") return ROOM || (ROOM = makeRoom()); if(name==="user") return USER || (USER = makeUser()); if(name==="downloads") return DOWNLOADS; return null; } };
window.__cloudSignOut = () => { writeDoc("presence/" + me.uid, null).catch(()=>{}).finally(() => { if(DEMO){ localStorage.removeItem(DEMO_KEY); location.href = location.href.split(/[?#]/)[0]; } else if(msalApp){ msalApp.logoutRedirect({ account }); } }); };

function seedEntries(mode){
  const S = window.__PO_SEED__ || {}, out = [];
  const st = Object.assign({}, S.settings||{}); delete st.sampleRev; out.push(["meta/settings", st]);
  if(mode === "none") return out;

  core.concat(mode === "demo" ? demo : []).forEach(col => Object.entries(S[col]||{}).forEach(([id, d]) => { const x = clone(d); delete x.id; if(col==="items" && mode!=="demo") x.stock = {}; if(col==="people") x.linkedUserId = ""; out.push([col + "/" + id, x]); }));
  return out;
}
let finished = false;
function finish(){
  if(finished) return; finished = true; $g().hidden = true;
  setInterval(() => { if(!document.hidden) sync(false); }, 5000);
  setInterval(() => sync(true), 300000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) sync(false); });
  if(DEMO){ const r = document.getElementById("demoRibbon"); r.hidden = false; r.innerHTML = `<span>Demo: data is kept in this browser only. Open this page in a second tab to watch changes appear live.</span><button id="demoOut">Leave demo</button>`; document.getElementById("demoOut").onclick = () => { localStorage.removeItem(DEMO_KEY); location.href = location.href.split(/[?#]/)[0]; }; }

  if(!window.msal || !msal.PublicClientApplication) return card(`<h1>Can't load Microsoft sign-in</h1><p style="font-size:14px">The Microsoft sign-in library didn't load. Check the internet connection, or ask IT to allow <code>cdn.jsdelivr.net</code>.</p><div class="row"><button class="btn" onclick="location.reload()">Reload</button></div>`);

    if(msalApp.initialize) await msalApp.initialize();

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

<script>

  return { sub, tax, ship, total: round(sub+tax+ship) };
}
function receivedTotal(po){
  const sub = (po.lines||[]).reduce((a,l)=>a+(+l.received||0)*(+l.price||0),0);
  const allIn = (po.lines||[]).every(l => (+l.received||0) >= (+l.qty||0));

}
const round = n => Math.round(n*100)/100;
function matchState(po){
  if(!po.invoice) return null;
  const expected = receivedTotal(po), inv = +po.invoice.amount||0;
  const diff = round(inv - expected);

}

  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({pos:S.pos,vendors:S.vendors,depts:S.depts,warehouses:S.warehouses,items:S.items,moves:S.moves,plants:S.plants,nominals:S.nominals,people:S.people,audit:S.audit,tenders:S.tenders,contracts:S.contracts,hires:S.hires,hireCats:S.hireCats,settings:S.settings})); } catch(e){}

    catch(e){

}

/* ---------- Overview ---------- */
function viewOverview(){

const FILTERS = [["all","All"],["draft","Drafts"],["pending","Awaiting approval"],["coding","Awaiting coding"],["grni","Received not invoiced"],["open","Open"],["received","Received"],["closed","Closed"],["rejected","Rejected"]];
function matchesFilter(p){
  const f = UI.status;
  if(f==="open" && !["approved","ordered","partial"].includes(p.status)) return false;
  if(f==="grni"){ if(!(grni(p)>0)) return false; } else if(f!=="all" && f!=="open" && p.status!==f) return false;
  const q = UI.q.trim().toLowerCase();
  if(q){ const hay = [p.number, vendorName(p.vendorId), deptName(p.deptId), ...(p.lines||[]).map(l=>l.desc)].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
  return true;
}

function budgetImpact(p){
  const d = S.depts[p.deptId]; if(!d || !+d.budget) return "";
  const y = year(p.createdAt) || String(new Date().getFullYear());
  const used = Object.values(S.pos).filter(x=>x.deptId===p.deptId && COMMITTED.includes(x.status) && year(x.createdAt)===y).reduce((a,x)=>a+totals(x).total,0);

function deptStats(d, y){
  const pos = Object.values(S.pos).filter(p=>p.deptId===d.id && year(p.createdAt)===y);
  const committed = pos.filter(p=>COMMITTED.includes(p.status)).reduce((a,p)=>a+totals(p).total,0);
  const received = pos.reduce((a,p)=>a+receivedTotal(p),0);
  const pending = pos.filter(p=>["pending","coding"].includes(p.status)).reduce((a,p)=>a+totals(p).total,0);
  return { committed, received, pending, budget:+d.budget||0 };
}
function budgetRows(compact){
  const ds = Object.values(S.depts).sort((a,b)=>a.name.localeCompare(b.name)), y = String(new Date().getFullYear());
  if(!ds.length) return `<p class="sub">Add departments with an annual budget to track spend against them.</p>`;
  return ds.map(d => {
    const s = deptStats(d,y), pct = s.budget ? s.committed/s.budget*100 : 0;
    const color = pct > 100 ? "var(--bad)" : pct > 85 ? "var(--warn)" : "var(--brand)";
    return `<div class="budget-row"><div class="top"><span><strong>${esc(d.name)}</strong>${d.code?` <span class="sub">${esc(d.code)}</span>`:""}</span><span>${money(s.committed)} <span class="sub">of ${s.budget?money(s.budget):"no budget set"}</span></span></div>
      <div class="bar"><span style="width:${Math.min(pct,100).toFixed(1)}%;background:${color}"></span></div>
      ${compact ? "" : `<div class="row sub" style="justify-content:space-between;margin-top:6px"><span>Received ${money(s.received)} · Awaiting approval ${money(s.pending)} · ${s.budget ? (s.budget-s.committed>=0 ? money(s.budget-s.committed)+" left" : money(s.committed-s.budget)+" over") : ""}</span><span class="row"><button class="btn small stock-only" data-action="dept-stock" data-dept="${d.id}">View stock</button>${ME.canWrite?`<button class="btn small" data-action="dept-form" data-id="${d.id}">Edit</button>`:""}</span></div>`}</div>`;
  }).join("");
}

function drawerActions(p){
  const a = [], w = ME.canWrite;
  const B = (act, label, cls) => `<button class="btn ${cls||""}" data-action="${act}" data-id="${p.id}">${label}</button>`;
  if(w){
    if(p.status==="draft"){ a.push(B("submit","Submit for approval","primary"), B("edit-po","Edit")); }
    if(p.status==="rejected"){ a.push(B("edit-po","Edit and resubmit","primary")); }
    if(p.status==="pending"){ if(ME.canApprove) a.push(B("approve","Approve value","good"), B("reject","Reject","danger")); a.push(B("withdraw","Withdraw")); }
    if(p.status==="coding"){ if(ME.canApprove) a.push(B("code-approve","Review coding","good"), B("reject","Send back","danger")); a.push(B("withdraw","Withdraw")); }
    if(p.status==="approved"){ a.push(B("send-po","Send to vendor","primary"), B("mark-sent","Mark as sent")); }
    if(p.status==="ordered"||p.status==="partial"){ a.push(B("receive","Receive items","primary")); }
    if(["ordered","partial","received"].includes(p.status)){ a.push(B("invoice","Record invoice")); }
    if(p.status==="received"){ a.push(B("close-po","Close order")); }
  }
  if(downloadsCap) a.push(B("download-po","Download PO"));
  if(w){ a.push(B("duplicate","Duplicate")); }
  if(w && ["draft","pending","coding","approved","rejected"].includes(p.status)) a.push(B("cancel-po", p.status==="draft"?"Delete draft":"Cancel order","danger"));
  return a.join("") || `<span class="sub">No actions available.</span>`;
}

/* ---------- Workflow ---------- */
function nextNumber(offset){
  const c = cfg(); let max = (+c.start||1001) - 1;
  Object.values(S.pos).forEach(p => { const n = parseInt(String(p.number||"").replace(/\D+/g,""),10); if(!isNaN(n) && n > max) max = n; });
  return (c.prefix||"") + (max+1+(offset||0));
}
function addHistory(po, action, note){ po.history = (po.history||[]).concat([{at:nowIso(), by:actorId(), action, note:note||""}]); }
const clone = o => JSON.parse(JSON.stringify(o));
async function transition(id, mutate, msg, stamp){
  const po = clone(S.pos[id]); if(!po) return;
  mutate(po); po.updatedAt = nowIso();
  if(stamp) UI.stampFor = id;
  try { await put("pos", id, po); if(msg) toast(typeof msg==="function" ? msg(po) : msg); } catch(e){}
  setTimeout(()=>{ if(UI.stampFor===id){ UI.stampFor=null; } }, 600);
}

function updateFormTotals(){

  M.po.lines.forEach((l,i)=>{ const a = document.querySelector(`[data-amt="${i}"]`); if(a) a.textContent = money((+l.qty||0)*(+l.price||0)); });

async function savePO(submit){
  const po = M.po, err = $("#formErr");
  po.lines = po.lines.map(l => Object.assign({}, l, { qty:+l.qty||0, price:+l.price||0, received:+l.received||0 }));
  const lines = po.lines.filter(l => String(l.desc).trim());
  if(!po.vendorId) return err.textContent = "Choose a vendor.";
  if(!po.deptId) return err.textContent = "Choose a department.";
  { const off = po.lines.filter(l=>l.itemId && S.items[l.itemId] && !itemForDept(S.items[l.itemId], po.deptId));
    if(off.length) return err.textContent = `${off.map(l=>l.desc).join(", ")} ${off.length===1?"isn't":"aren't"} set up for ${deptName(po.deptId)}. Remove ${off.length===1?"it":"them"}, or add the department to the item.`; }
  if(!lines.length) return err.textContent = "Add at least one item with a description.";
  if(lines.some(l => l.qty <= 0)) return err.textContent = "Every item needs a quantity above zero.";
  po.lines = lines; po.taxRate = +po.taxRate||0; po.shipping = +po.shipping||0;
  if(M.isNew){ po.id = uid(); po.number = nextNumber(); po.createdAt = nowIso(); po.requesterId = actorId(); po.status = "draft"; po.history = []; addHistory(po,"Created"); }
  else { if(po.status==="rejected"){ po.status="draft"; } addHistory(po,"Edited"); }
  po.contractId = (activeContract(po.vendorId)||{}).id || "";
  autoCode(po);
  if(submit) submitPO(po);
  po.updatedAt = nowIso();
  const id = po.id, s = po.status;
  try { await put("pos", id, po); } catch(e){ return; }
  closeModal(); UI.openId = id; UI.stampFor = submit ? id : null; render();
  toast(submit ? submitMsg(po) : `${po.number} saved as draft`);
}

/* ---------- Stock & warehouses ---------- */
const MOVE = { receipt:"Received", issue:"Issued", transfer:"Transferred", adjust:"Count adjustment" };
const UNITS = ["each","box","pack","case","pallet","kg","litre","metre","roll"];
const OPEN_PO = ["draft","pending","coding","approved","ordered","partial"];
function sortedWh(){ return Object.values(S.warehouses).sort((a,b)=>(a.name||"").localeCompare(b.name||"")); }
function sortedItems(){ return Object.values(S.items).sort((a,b)=>(a.name||"").localeCompare(b.name||"")); }
function whName(id){ const w = S.warehouses[id]; return w ? w.name : (id ? "Removed warehouse" : "—"); }
function onHand(it, wh){ const s = (it && it.stock) || {}; return wh ? (+s[wh]||0) : round(Object.keys(s).filter(k=>S.warehouses[k]||true).reduce((a,k)=>a+(+s[k]||0),0)); }
function onOrder(itemId){
  return Object.values(S.pos).filter(p=>OPEN_PO.includes(p.status)).reduce((a,p)=>a+(p.lines||[]).filter(l=>l.itemId===itemId).reduce((b,l)=>b+Math.max(0,(+l.qty||0)-(+l.received||0)),0),0);
}
function needsReorder(it){ return (+it.reorderPoint||0) > 0 && onHand(it) + onOrder(it.id) <= +it.reorderPoint; }
function stockState(it){ const h = onHand(it); if(h <= 0) return "out"; if(h <= (+it.reorderPoint||0)) return "low"; return "ok"; }
function stockPill(it){
  const st = stockState(it), m = { out:["Out of stock","bad"], low:["Low stock","warn"], ok:["In stock","ok"] }[st];
  return `<span class="pill" style="color:var(--${m[1]});background:var(--${m[1]}-bg)">${m[0]}</span>`;
}
function stockValue(wh){ return round(Object.values(S.items).reduce((a,it)=>a+onHand(it,wh)*(+it.cost||0),0)); }
function reorderQtyFor(it){ return +it.reorderQty || Math.max(1, (+it.reorderPoint||0)*2 - onHand(it) - onOrder(it.id)); }
function fmtQty(n, it){ return `${+n||0}${it && it.unit && it.unit!=="each" ? " "+esc(it.unit) : ""}`; }
async function applyStock(itemId, deltas, moves, extra){
  const it = clone(S.items[itemId]); it.stock = it.stock || {};
  Object.entries(deltas).forEach(([w,d]) => { it.stock[w] = round((+it.stock[w]||0) + d); if(it.stock[w]===0) delete it.stock[w]; });
  if(extra) Object.assign(it, extra);
  await put("items", itemId, it);
  for(const m of moves){ await put("moves", uid(), Object.assign({ at:nowIso(), by:actorId(), itemId, note:"" }, m)); }
}
function setLineInput(i, f, v){ const el = document.querySelector(`[data-line="${i}"][data-lf="${f}"]`); if(el) el.value = v; }
function lineInput(i, f, v){
  const l = M.po.lines[i]; l[f] = v;
  if(f!=="sku" && f!=="desc") return;
  const q = String(v).trim().toLowerCase();
  const it = q && deptItems(M.po.deptId).find(x => f==="sku" ? (x.sku||"").toLowerCase()===q : (x.name||"").toLowerCase()===q);
  if(it){
    l.itemId = it.id;
    if(f==="sku" && !String(l.desc||"").trim()){ l.desc = it.name; setLineInput(i,"desc",it.name); }
    if(f==="desc" && !String(l.sku||"").trim()){ l.sku = it.sku; setLineInput(i,"sku",it.sku); }
    if(!(+l.price) && +it.cost){ l.price = +it.cost; setLineInput(i,"price",it.cost); }
    if(!l.nominal){ const n = suggestNominal(l, M.po); if(n){ l.nominal = n; setLineInput(i,"nominal",n); } }
    { const cp = contractPrice(M.po.vendorId || it.vendorId, it.id); if(cp){ l.price = cp.price; setLineInput(i,"price",cp.price); } }
    if(!M.po.vendorId && it.vendorId && S.vendors[it.vendorId]){ M.po.vendorId = it.vendorId; const vs = document.querySelector('[data-f="vendorId"]'); if(vs) vs.value = it.vendorId; }
  } else if(l.itemId){
    const cur = S.items[l.itemId];
    if(!cur || ((l.sku||"").toLowerCase()!==(cur.sku||"").toLowerCase() && (l.desc||"").toLowerCase()!==(cur.name||"").toLowerCase())) delete l.itemId;
  }
}

function moveTable(rows, showItem){
  if(!rows.length) return `<p class="sub">No stock movements yet. Deliveries, issues, transfers and counts will appear here.</p>`;
  return `<div class="table-wrap"><table><thead><tr><th>When</th>${showItem?"<th>Item</th>":""}<th>Movement</th><th class="num">Qty</th><th>Warehouse</th><th>Reference</th><th>By</th></tr></thead><tbody>${rows.map(m => {
    const it = S.items[m.itemId], q = +m.qty||0;
    const sign = m.type==="receipt" ? 1 : m.type==="issue" ? -1 : m.type==="adjust" ? Math.sign(q) : 0;
    const qtxt = m.type==="adjust" ? (q>0?"+":"")+q : m.type==="issue" ? "−"+q : m.type==="receipt" ? "+"+q : String(q);
    const where = m.type==="transfer" ? `${esc(whName(m.fromWh))} to ${esc(whName(m.toWh))}` : esc(whName(m.toWh || m.fromWh));
    const ref = m.poId ? `<button class="link-btn" data-action="open-po" data-id="${m.poId}">${esc(m.poNumber||"PO")}</button>${m.note?`<div class="sub">${esc(m.note)}</div>`:""}` : esc(m.note||"—");
    return `<tr><td style="white-space:nowrap">${fmtDateTime(m.at)}</td>${showItem?`<td>${it?`<button class="link-btn" data-action="open-item" data-id="${it.id}">${esc(it.name)}</button>`:`<span class="sub">Deleted item</span>`}</td>`:""}
      <td>${MOVE[m.type]||m.type}</td><td class="num ${sign>0?"qty-pos":sign<0?"qty-neg":""}">${qtxt}</td><td>${where}</td><td>${ref}</td><td>${esc(personName(m.by))}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}
function sortedMoves(){ return Object.values(S.moves).sort((a,b)=>(b.at||"").localeCompare(a.at||"")); }

function sortedPlants(){ return Object.values(S.plants).sort((a,b)=>(a.name||"").localeCompare(b.name||"")); }
function itemDepts(it){
  if(it.deptIds && it.deptIds.length){ const own = it.deptIds.filter(d=>S.depts[d]); if(own.length) return own; }
  const p = S.plants[it.plantId];
  return p && p.deptIds ? p.deptIds.filter(d=>S.depts[d]) : [];
}
function matchesDeptFilter(it){ return UI.sdept==="all" || (UI.sdept==="shared" ? !itemDepts(it).length : itemForDept(it, UI.sdept)); }
function deptFilterSelect(){
  const ds = Object.values(S.depts).sort((a,b)=>a.name.localeCompare(b.name));
  if(!ds.length) return "";
  return `<select id="deptFilter" class="search" style="flex:0 1 210px;min-width:160px" aria-label="Filter by department"><option value="all">All departments</option>${ds.map(d=>`<option value="${d.id}" ${UI.sdept===d.id?"selected":""}>${esc(d.name)}</option>`).join("")}<option value="shared" ${UI.sdept==="shared"?"selected":""}>Shared by all departments</option></select>`;
}
function itemForDept(it, dept){ const ds = itemDepts(it); return !ds.length || ds.includes(dept); }
function deptItems(dept){ return dept ? sortedItems().filter(it=>itemForDept(it, dept)) : []; }
function deptLabel(it){
  const ds = itemDepts(it), own = it.deptIds && it.deptIds.some(d=>S.depts[d]);
  return ds.length ? ds.map(deptName).join(", ") + (own ? "" : " (from plant)") : "All departments";
}
function deptChecks(attr, selected){
  const ds = Object.values(S.depts).sort((a,b)=>a.name.localeCompare(b.name));
  if(!ds.length) return `<span class="sub">Add departments on the Budgets page first.</span>`;
  return `<div class="checks">${ds.map(d=>`<label class="check"><input type="checkbox" ${attr} value="${d.id}" ${(selected||[]).includes(d.id)?"checked":""}> ${esc(d.name)}</label>`).join("")}</div>`;
}
function stockPicker(po){
  if(!Object.keys(S.items).length) return "";
  if(!po.deptId) return `<span class="sub">Choose a department to see the stock items it orders.</span>`;
  const its = deptItems(po.deptId), dn = esc(deptName(po.deptId));
  if(!its.length) return `<span class="sub">No stock items are set up for ${dn}. You can still type free-text lines.</span>`;
  const groups = {};
  its.forEach(it => { const k = it.plantId && S.plants[it.plantId] ? plantName(it.plantId) + (compName(it) ? " · " + compName(it) : "") : "General stock"; (groups[k] = groups[k] || []).push(it); });
  const keys = Object.keys(groups).sort((a,b) => a==="General stock" ? 1 : b==="General stock" ? -1 : a.localeCompare(b));
  return `<select id="addStockItem" class="search" style="flex:1 1 300px;max-width:420px" aria-label="Add a stock item"><option value="">Add a stock item · ${its.length} for ${dn}</option>${keys.map(k=>`<optgroup label="${esc(k)}">${groups[k].map(it=>`<option value="${it.id}">${esc(it.name)} · ${esc(it.sku)}${stockOn() ? ` · ${onHand(it)} in stock` : ""}</option>`).join("")}</optgroup>`).join("")}</select>`;
}
function plantsAtSite(site){ return sortedPlants().filter(p => site==="all" || (site==="none" ? !(p.siteId && S.warehouses[p.siteId]) : p.siteId===site)); }
function siteSelect(id){
  const noSite = sortedPlants().some(p=>!(p.siteId && S.warehouses[p.siteId]));
  return `<select id="${id}" class="search" style="flex:0 1 200px;min-width:150px" aria-label="Filter plants by site"><option value="all">Plants at all sites</option>${sortedWh().map(w=>`<option value="${w.id}" ${UI.psite===w.id?"selected":""}>Plants at ${esc(w.name)}</option>`).join("")}${noSite?`<option value="none" ${UI.psite==="none"?"selected":""}>Plants with no site</option>`:""}</select>`;
}
function plantName(id){ const p = S.plants[id]; return p ? p.name : ""; }
function compName(it){ const p = S.plants[it.plantId]; const c = p && (p.components||[]).find(c=>c.id===it.componentId); return c ? c.name : ""; }
function compOptions(pid, sel){
  const p = S.plants[pid];
  return `<option value="">${p ? "General parts for this plant" : "Choose a plant first"}</option>` + (p ? (p.components||[]).map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}</option>`).join("") : "");
}
function groupedRows(rows, ncols, rowFn, filtering){
  const plants = plantsAtSite(UI.psite), byPlant = new Map(plants.map(p=>[p.id,[]])), general = [];
  rows.forEach(it => { if(it.plantId && byPlant.has(it.plantId)) byPlant.get(it.plantId).push(it); else general.push(it); });
  const val = its => money(its.reduce((a,it)=>a+onHand(it)*(+it.cost||0),0));
  const w = ME.canWrite;
  let html = "";
  const compHead = (name, n, pid, cid) => `<tr class="grp-comp"><td colspan="${ncols}"><span class="grp-comp-name">${esc(name)}</span> <span class="sub">${n} part${n===1?"":"s"}</span>${w && pid ? `<button class="btn small ghost grp-add" data-action="item-form" data-plant="${pid}" data-comp="${cid||""}">Add part</button>` : ""}</td></tr>`;
  const section = (key, title, sub, items, comps, pid) => {
    if(!items.length && filtering) return;
    const closed = !!UI.collapsed[key];
    const low = items.filter(needsReorder).length;
    html += `<tr class="grp-plant"><td colspan="${ncols}"><div class="grp-plant-row"><button class="grp-toggle" data-action="toggle-group" data-key="${key}" aria-expanded="${!closed}"><span class="caret" aria-hidden="true">${closed?"▸":"▾"}</span>${esc(title)}</button>
      <span class="sub">${sub}${low?` · <span style="color:var(--warn);font-weight:600">${low} to reorder</span>`:""}</span>${pid?`<button class="link-btn" data-action="plant-select" data-plant="${pid}">Open plant</button>`:""}<span class="grp-right">${val(items)}</span></div></td></tr>`;
    if(closed) return;
    comps.forEach(c => {
      const ci = items.filter(it=>it.componentId===c.id);
      if(!ci.length && filtering) return;
      html += compHead(c.name, ci.length, pid, c.id);
      html += ci.length ? ci.map(it=>rowFn(it,2)).join("") : `<tr><td colspan="${ncols}" class="sub ind2">No parts linked to this component yet.</td></tr>`;
    });
    const loose = items.filter(it => !comps.some(c=>c.id===it.componentId));
    if(loose.length){ if(comps.length || pid) html += compHead(pid ? "General parts" : "Items", loose.length, pid, ""); html += loose.map(it=>rowFn(it, 2)).join(""); }
    if(!items.length && !comps.length) html += `<tr><td colspan="${ncols}" class="sub ind1">No components or parts yet.</td></tr>`;
  };
  plants.forEach(p => { const comps = p.components||[]; section(p.id, p.name, `${p.code?esc(p.code)+" · ":""}${p.siteId&&S.warehouses[p.siteId]?esc(whName(p.siteId))+" · ":""}${comps.length} component${comps.length===1?"":"s"} · ${byPlant.get(p.id).length} parts`, byPlant.get(p.id), comps, p.id); });
  if(general.length && UI.psite==="all") section("general", "General stock", "Not linked to a plant", general, [], null);
  return html;
}

function viewStock(){
  const whs = sortedWh(), items = sortedItems(), w = ME.canWrite, plants = sortedPlants();
  const actions = `${items.length?`<button class="btn" data-action="export-stock">Export CSV</button>`:""}${w && items.length?`<button class="btn" data-action="move-form">Record movement</button>`:""}${w && whs.length?`<button class="btn primary" data-action="item-form">Add stock item</button>`:""}`;
  const head = header("Stock", "What you hold, where it's kept, and what needs reordering.", actions);
  if(!whs.length) return head + `<div class="panel empty"><strong>Add a site first</strong>Stock is always held somewhere.${w?`<div style="margin-top:12px"><button class="btn primary" data-action="wh-form">Add site</button></div>`:""}</div>`;
  if(!items.length) return head + `<div class="panel empty"><strong>No stock items yet</strong>Add the parts and products you keep on hand. Link them to a plant and component to see them grouped, and to purchase order lines so deliveries add to stock automatically.</div>`;
  if(UI.swh!=="all" && !S.warehouses[UI.swh]) UI.swh = "all";
  if(UI.splant!=="all" && UI.splant!=="general" && !S.plants[UI.splant]) UI.splant = "all";
  if(UI.psite!=="all" && UI.psite!=="none" && !S.warehouses[UI.psite]) UI.psite = "all";
  const sitePlants = plantsAtSite(UI.psite);
  if(UI.sdept!=="all" && UI.sdept!=="shared" && !S.depts[UI.sdept]) UI.sdept = "all";
  if(UI.splant==="general" ? UI.psite!=="all" : (UI.splant!=="all" && !sitePlants.some(p=>p.id===UI.splant))) UI.splant = "all";
  const bySite = UI.stockMode==="sites";
  const wh = (bySite || UI.swh==="all") ? null : UI.swh, q = UI.sq.trim().toLowerCase();
  const reorder = items.filter(needsReorder);
  const rows = items.filter(it =>
    (!q || [it.name,it.sku,it.category,plantName(it.plantId),compName(it)].join(" ").toLowerCase().includes(q)) &&
    (!UI.sReorder || needsReorder(it)) &&
    (UI.splant==="all" || (UI.splant==="general" ? !(it.plantId && S.plants[it.plantId]) : it.plantId===UI.splant)) &&
    (UI.psite==="all" || sitePlants.some(p=>p.id===it.plantId)) &&
    matchesDeptFilter(it));
  const grouped = plants.length > 0, filtering = !!q || UI.sReorder || UI.sdept!=="all";
  return head +
  (reorder.length ? `<div class="banner row" style="justify-content:space-between"><span>${reorder.length} item${reorder.length===1?" is":"s are"} at or below the reorder point, counting what's already on order.</span>${w?`<button class="btn small primary" data-action="reorder-all">Create reorder drafts</button>`:""}</div>` : "") +
  (bySite ? siteCards() : "") + `<div class="kpis" ${bySite?"hidden":""}>
    <div class="kpi" style="cursor:default"><div class="v">${money(stockValue(wh))}</div><div class="l">Stock value${wh?" at "+esc(whName(wh)):""}</div></div>
    <div class="kpi" style="cursor:default"><div class="v">${items.filter(it=>onHand(it,wh)>0).length}</div><div class="l">Items in stock</div></div>
    <div class="kpi" style="cursor:default"><div class="v">${items.filter(it=>stockState(it)==="out").length}</div><div class="l">Out of stock</div></div>
  </div>
  <div class="toolbar"><input class="search" id="stockSearch" type="search" placeholder="Search by part, SKU, plant or component" value="${esc(UI.sq)}" aria-label="Search stock">
    ${deptFilterSelect()}${grouped ? `${siteSelect("plantSiteFilter")}<select id="plantFilter" class="search" style="flex:0 1 200px;min-width:150px" aria-label="Filter by plant"><option value="all">${UI.psite==="all"?"All plants":"All plants at "+esc(siteLabel(UI.psite))}</option>${sitePlants.map(p=>`<option value="${p.id}" ${UI.splant===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}${UI.psite==="all"?`<option value="general" ${UI.splant==="general"?"selected":""}>General stock</option>`:""}</select>` : ""}
    <div class="chips"><button class="chip" data-action="stock-mode" data-mode="sites" aria-pressed="${bySite}">By site</button><button class="chip" data-action="stock-mode" data-mode="list" aria-pressed="${!bySite}">List</button></div>
    <div class="chips">${bySite ? "" : `<button class="chip" data-action="set-swh" data-wh="all" aria-pressed="${!wh}">All sites</button>${whs.map(x=>`<button class="chip" data-action="set-swh" data-wh="${x.id}" aria-pressed="${wh===x.id}">${esc(x.name)}</button>`).join("")}`}
    <button class="chip" data-action="toggle-reorder" aria-pressed="${UI.sReorder}">Needs reorder</button></div></div>` +
  (UI.sdept!=="all" ? `<div class="banner row" style="justify-content:space-between;background:var(--tint);color:var(--ink)"><span>Showing <strong>${rows.length}</strong> item${rows.length===1?"":"s"} ${UI.sdept==="shared" ? "shared by all departments" : `that <strong>${esc(deptName(UI.sdept))}</strong> orders, including items shared by all departments`} · stock value <strong>${money(rows.reduce((a,it)=>a+onHand(it,wh)*(+it.cost||0),0))}</strong></span><button class="btn small" data-action="clear-sdept">Show all departments</button></div>` : "") +
  (rows.length ? (bySite ? siteMatrix(rows, grouped, filtering) : listTable(rows, wh, grouped, filtering))
    : `<div class="table-wrap"><div class="empty">${UI.psite!=="all" && !sitePlants.length ? `<strong>No plants at ${esc(siteLabel(UI.psite))}</strong>Set a plant's site on the Plants page to see its parts here.` : `<strong>No items match</strong>Try a different search or clear the filters.`}</div></div>`) +
  `<section class="section" style="margin-top:28px"><h2>Recent movements</h2>${moveTable(sortedMoves().filter(m => (!wh || m.toWh===wh || m.fromWh===wh) && ((UI.splant==="all" && UI.sdept==="all" && UI.psite==="all") || rows.some(it=>it.id===m.itemId))).slice(0,15), true)}</section>`;
}
function listRow(it, wh, ind){
  const h = onHand(it, wh), w = ME.canWrite;
  return `<tr class="click" data-action="open-item" data-id="${it.id}" tabindex="0">
    <td class="${ind?"ind"+ind:""}"><strong>${esc(it.name)}</strong><div class="sub">${esc(it.sku)} · ${esc(deptLabel(it))}</div></td><td>${esc(it.category||"—")}</td>
    <td class="num">${fmtQty(h,it)}</td><td class="num">${onOrder(it.id)||"—"}</td><td class="num">${+it.reorderPoint||"—"}</td>
    <td class="num">${money(h*(+it.cost||0))}</td><td>${stockPill(it)}</td>
    <td class="num">${w && needsReorder(it) ? `<button class="btn small" data-action="reorder-item" data-id="${it.id}">Reorder</button>` : ""}</td></tr>`;
}
function listTable(rows, wh, grouped, filtering){
  return `<div class="table-wrap"><table><thead><tr><th>Item</th><th>Category</th><th class="num">On hand${wh?"":" (all)"}</th><th class="num">On order</th><th class="num">Reorder at</th><th class="num">Value</th><th>Status</th><th></th></tr></thead><tbody>${
    grouped ? groupedRows(rows, 8, (it,ind)=>listRow(it,wh,ind), filtering) : rows.map(it=>listRow(it,wh,0)).join("")}</tbody></table></div>`;
}
function siteSummary(w){
  const its = Object.values(S.items), held = its.filter(it => onHand(it,w.id) > 0);
  return { value: stockValue(w.id), units: round(held.reduce((a,it)=>a+onHand(it,w.id),0)), lines: held.length, out: its.length - held.length,
    inbound: Object.values(S.pos).filter(p=>p.warehouseId===w.id && ["approved","ordered","partial"].includes(p.status)).length,
    plants: Object.values(S.plants).filter(p=>p.siteId===w.id).length };
}
function siteCards(){
  return `<div class="sites">${sortedWh().map(w => { const s = siteSummary(w); return `<button class="site" data-action="ws-open" data-wh="${w.id}">
    <span class="site-name">${esc(w.name)}${w.code?` <span class="sub">${esc(w.code)}</span>`:""}</span>
    <span class="site-v">${money(s.value)}</span>
    <span class="sub">${s.lines} item${s.lines===1?"":"s"} held · ${s.units} units</span>
    <span class="sub">${s.out} not stocked here · ${s.inbound} inbound order${s.inbound===1?"":"s"}</span>
    <span class="sub">${s.plants} plant${s.plants===1?"":"s"} at this site</span></button>`; }).join("")}</div>`;
}
function matrixRow(it, whs, ind){
  return `<tr class="click" data-action="open-item" data-id="${it.id}" tabindex="0"><td class="${ind?"ind"+ind:""}"><strong>${esc(it.name)}</strong><div class="sub">${esc(it.sku)} · ${esc(deptLabel(it))}</div></td>
    ${whs.map(w => { const q = onHand(it,w.id); return `<td class="num ${q<=0?"cell-zero":""}${w.id===UI.psite?" col-hl":""}">${q}</td>`; }).join("")}
    <td class="num"><strong>${fmtQty(onHand(it),it)}</strong></td><td class="num">${onOrder(it.id)||"—"}</td><td>${stockPill(it)}</td></tr>`;
}
function siteMatrix(rows, grouped, filtering){
  const whs = sortedWh(), n = whs.length + 4;
  const val = (w) => money(round(rows.reduce((a,it)=>a+onHand(it,w)*(+it.cost||0),0)));
  return `<div class="table-wrap"><table class="matrix"><thead><tr><th>Item</th>${whs.map(w=>`<th class="num${w.id===UI.psite?" col-hl":""}">${esc(w.name)}</th>`).join("")}<th class="num">Total</th><th class="num">On order</th><th>Status</th></tr></thead><tbody>${
    grouped ? groupedRows(rows, n, (it,ind)=>matrixRow(it,whs,ind), filtering) : rows.map(it=>matrixRow(it,whs,0)).join("")}</tbody>
    <tfoot><tr><td>Stock value</td>${whs.map(w=>`<td class="num">${val(w.id)}</td>`).join("")}<td class="num">${val()}</td><td></td><td></td></tr></tfoot></table></div>`;
}
function siteBars(){
  const whs = sortedWh(), vals = whs.map(w => stockValue(w.id)), max = Math.max(1, ...vals);
  return whs.map((w,i) => { const s = siteSummary(w); return `<div class="budget-row"><div class="top"><button class="link-btn" data-action="ws-open" data-wh="${w.id}">${esc(w.name)}</button><span>${money(vals[i])}</span></div>
    <div class="bar"><span style="width:${(vals[i]/max*100).toFixed(1)}%;background:var(--brand)"></span></div><div class="sub" style="margin-top:4px">${s.lines} items held · ${s.units} units · ${s.out} not stocked here</div></div>`; }).join("");
}

/* Plants */
function siteLabel(s){ return s==="none" ? "no site" : whName(s); }
function plantSiteChips(){
  const all = sortedPlants(), noSite = all.filter(p=>!(p.siteId && S.warehouses[p.siteId])).length;
  const chip = (id, label, n) => `<button class="chip" data-action="set-psite" data-site="${id}" aria-pressed="${UI.psite===id}">${label} <span class="chip-n">${n}</span></button>`;
  return `<div class="chips" role="group" aria-label="Filter plants by site">${chip("all","All sites",all.length)}${sortedWh().map(w=>chip(w.id, esc(w.name), all.filter(p=>p.siteId===w.id).length)).join("")}${noSite?chip("none","No site set",noSite):""}</div>`;
}
function plantCard(p){
  const w = ME.canWrite, its = Object.values(S.items).filter(it=>it.plantId===p.id), comps = p.components||[];
  const value = its.reduce((a,it)=>a+onHand(it)*(+it.cost||0),0);
  const loose = its.filter(it=>!comps.some(c=>c.id===it.componentId));
  const compRow = (name, ci, cid) => { const low = stockOn() ? ci.filter(needsReorder).length : 0, nd = ci.filter(it=>!String(it.details||"").trim()).length; return `<div class="list-item"><div><strong>${esc(name)}</strong><div class="sub">${ci.length} part${ci.length===1?"":"s"}${low?` · <span style="color:var(--warn);font-weight:600">${low} to reorder</span>`:""}${nd?` · <span style="color:var(--warn);font-weight:600">${nd} need${nd===1?"s":""} a description</span>`:""}</div></div>${w?`<button class="btn small" data-action="item-form" data-plant="${p.id}" data-comp="${cid}">Add part</button>`:""}</div>`; };
  return `<section class="panel"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 style="margin:0"><button class="link-btn plant-title" data-action="plant-select" data-plant="${p.id}">${esc(p.name)}</button></h2>
    <div class="sub">${[p.code, p.siteId && S.warehouses[p.siteId] ? whName(p.siteId) : "No site set", (p.deptIds||[]).filter(d=>S.depts[d]).map(deptName).join(" & "), `${its.length} parts`, stockOn() ? money(value) : ""].filter(Boolean).map(esc).join(" · ")}</div></div>
    <div class="row"><button class="btn small primary" data-action="plant-select" data-plant="${p.id}">Open plant</button>${w?`<button class="btn small" data-action="plant-form" data-id="${p.id}">Edit</button>`:""}</div></div>
    <div class="list" style="margin-top:8px">${comps.map(c=>compRow(c.name, its.filter(it=>it.componentId===c.id), c.id)).join("")}${loose.length?compRow("General parts", loose, ""):""}${!comps.length&&!loose.length?`<p class="sub">No components yet. Edit the plant to add them.</p>`:""}</div></section>`;
}
function plantPick(){
  const ps = plantsAtSite(UI.psite);
  let opts;
  if(UI.psite==="all"){
    const groups = [...sortedWh().map(w=>({id:w.id,name:w.name})), {id:"none",name:"No site set"}].map(g=>Object.assign(g,{ps:plantsAtSite(g.id)})).filter(g=>g.ps.length);
    opts = groups.map(g=>`<optgroup label="${esc(g.name)}">${g.ps.map(p=>`<option value="${p.id}" ${UI.plantSel===p.id?"selected":""}>${esc(p.name)}${p.code?" ("+esc(p.code)+")":""}</option>`).join("")}</optgroup>`).join("");
  } else opts = ps.map(p=>`<option value="${p.id}" ${UI.plantSel===p.id?"selected":""}>${esc(p.name)}${p.code?" ("+esc(p.code)+")":""}</option>`).join("");

async function savePlant(){

  if(!p.name) return err.textContent = "Enter the plant name.";

  const used = cid => M.id && Object.values(S.items).some(it=>it.plantId===M.id && it.componentId===cid);
  p.components = p.components.map(c=>({id:c.id, name:String(c.name||"").trim()})).filter(c => c.name || used(c.id)).map(c => c.name ? c : Object.assign(c,{name:"Unnamed component"}));
  const names = p.components.map(c=>c.name.toLowerCase());
  if(new Set(names).size !== names.length) return err.textContent = "Two components have the same name.";
  try { await put("plants", M.id || uid(), { name:p.name, code:p.code, siteId:p.siteId||"", components:p.components, deptIds:(p.deptIds||[]).filter(d=>S.depts[d]) }); } catch(e){ return; }
  audit("Plant", M.id||"", M.id?"Edited plant":"Added plant", p.name);
  closeModal(); toast(`${p.name} saved`);
}

async function saveMove(){
  const err = $("#formErr"), it = S.items[M.itemId], t = M.type, q = round(+M.qty||0);
  if(!it) return err.textContent = "Choose an item.";
  if(!M.from || !S.warehouses[M.from]) return err.textContent = "Choose a warehouse.";
  const have = onHand(it, M.from), note = String(M.note||"").trim(), iid = it.id;
  let deltas, move, msg;
  if(t==="adjust"){
    if(M.count==="" || +M.count < 0) return err.textContent = "Enter the quantity you counted.";
    const d = round(+M.count - have);
    if(!d) return err.textContent = "The count matches current stock. Nothing to record.";
    deltas = {[M.from]: d}; move = { type:"adjust", qty:d, toWh:M.from, note: note || `Counted ${+M.count}` }; msg = `Stock count saved (${d>0?"+":""}${d})`;
  } else {
    if(!(q > 0)) return err.textContent = "Enter a quantity above zero.";
    if(t==="issue"){ if(q > have) return err.textContent = `Only ${have} on hand in ${whName(M.from)}.`; deltas = {[M.from]: -q}; move = { type:"issue", qty:q, fromWh:M.from, note }; msg = `Issued ${q} ${it.name}`; }
    if(t==="receipt"){ deltas = {[M.from]: q}; move = { type:"receipt", qty:q, toWh:M.from, note }; msg = `Received ${q} ${it.name}`; }
    if(t==="transfer"){
      if(!M.to || M.to===M.from) return err.textContent = "Choose a different destination warehouse.";
      if(q > have) return err.textContent = `Only ${have} on hand in ${whName(M.from)}.`;
      deltas = {[M.from]: -q, [M.to]: q}; move = { type:"transfer", qty:q, fromWh:M.from, toWh:M.to, note }; msg = `Moved ${q} to ${whName(M.to)}`;
    }
  }
  try { await applyStock(iid, deltas, [move]); } catch(e){ return; }
  closeModal(); toast(msg);
}

/* ---------- Nominal codes & coding approval ---------- */
const byName = (a,b) => (a.name||"").localeCompare(b.name||"");
const datePlus = n => new Date(Date.now()+n*864e5).toISOString().slice(0,10);
function sortedNominals(){ return Object.values(S.nominals).sort((a,b)=>String(a.code).localeCompare(String(b.code), undefined, {numeric:true})); }
function nominalLabel(id){ const n = S.nominals[id]; return n ? `${n.code} ${n.name}` : ""; }
function nominalOptions(sel, blank){
  return `<option value="">${blank||"Not coded"}</option>` + sortedNominals().filter(n=>n.active!==false || n.id===sel).map(n=>`<option value="${n.id}" ${n.id===sel?"selected":""}>${esc(n.code)} · ${esc(n.name)}</option>`).join("");
}
function nominalForCategory(cat){
  if(!cat) return ""; const c = String(cat).trim().toLowerCase();
  const n = Object.values(S.nominals).find(n => n.active!==false && (n.categories||[]).some(x=>String(x).trim().toLowerCase()===c));
  return n ? n.id : "";
}
function suggestNominal(l, po){
  const it = l.itemId && S.items[l.itemId], v = S.vendors[po.vendorId], d = S.depts[po.deptId];
  { const h = l.hireId && S.hires[l.hireId], hc = h && S.hireCats[h.catId]; if(hc && hc.nominalId && S.nominals[hc.nominalId]) return hc.nominalId; }
  return (it && nominalForCategory(it.category))
    || (v && (nominalForCategory(v.category) || (v.supplies||[]).map(nominalForCategory).find(Boolean)))
    || (d && d.nominalId && S.nominals[d.nominalId] ? d.nominalId : "") || "";
}
function autoCode(po){ (po.lines||[]).forEach(l => { if(!l.nominal || !S.nominals[l.nominal]) l.nominal = suggestNominal(l, po) || ""; }); }
function uncoded(po){ return (po.lines||[]).filter(l => !l.nominal || !S.nominals[l.nominal]); }
function toCoding(po){
  const hasCodes = Object.keys(S.nominals).length > 0;
  autoCode(po);
  const unc = uncoded(po).length, over = totals(po).total > +cfg().codingThreshold;
  if(hasCodes && (unc || over)){
    po.status = "coding"; po.codingAt = nowIso();
    addHistory(po, "Sent for coding approval", unc ? `${unc} line${unc===1?"":"s"} need${unc===1?"s":""} a nominal code` : `Over the ${money(cfg().codingThreshold)} coding review limit`);
  } else {
    po.status = "approved"; po.approvedAt = nowIso();
    addHistory(po, hasCodes ? "Coded automatically and approved" : "Approved");
  }
}
function submitPO(po){
  addHistory(po, "Submitted for approval");
  if(totals(po).total <= +cfg().threshold){ addHistory(po, "Value approved automatically", `Under the ${money(cfg().threshold)} approval limit`); toCoding(po); }
  else { po.status = "pending"; po.submittedAt = nowIso(); }
}
function submitMsg(po){ return po.status==="approved" ? `${po.number} approved automatically` : po.status==="coding" ? `${po.number} sent for coding approval` : `${po.number} sent for approval`; }
function allCategories(){ const s = new Set(); Object.values(S.items).forEach(it=>it.category&&s.add(it.category)); Object.values(S.vendors).forEach(v=>v.category&&s.add(v.category)); return [...s].sort(); }

async function saveNominal(){

/* ---------- Invoices & GRNI ---------- */
function poInvoices(po){
  if(po.invoices) return po.invoices;
  if(!po.invoice) return [];
  const gross = +po.invoice.amount||0, net = round(gross/(1+(+po.taxRate||0)/100));
  return [{ id:"legacy", number:po.invoice.number, date:po.invoice.date, net, vat:round(gross-net) }];
}
const CARRIAGE = { start:"On first delivery", partial:"Pro rata with each delivery", complete:"When the order is complete" };
function carriageRule(po){ const v = S.vendors[po.vendorId]; return po.carriage || (v && v.carriage) || cfg().carriage || "complete"; }
function carriageSource(po){ return po.carriage ? "set on this order" : (S.vendors[po.vendorId]||{}).carriage ? "vendor default" : "company default"; }
function carriageReceived(po){
  const ship = +po.shipping||0; if(!ship) return 0;
  const ls = po.lines||[], ord = ls.reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0), rec = ls.reduce((a,l)=>a+(+l.received||0)*(+l.price||0),0);
  const any = ls.some(l=>(+l.received||0)>0), all = ls.length && ls.every(l=>(+l.received||0)>=(+l.qty||0)), r = carriageRule(po);
  if(r==="start") return any ? ship : 0;
  if(r==="partial") return ord ? round(ship*Math.min(1, rec/ord)) : (all ? ship : 0);
  return all ? ship : 0;
}
function carriageOptions(sel, defLabel){ return `<option value="">${defLabel}</option>` + Object.entries(CARRIAGE).map(([k,l])=>`<option value="${k}" ${k===sel?"selected":""}>${l}</option>`).join(""); }
function orderNet(po){ const t = totals(po); return round(t.sub + t.ship); }
function receivedNet(po){
  const sub = (po.lines||[]).reduce((a,l)=>a+(+l.received||0)*(+l.price||0),0);
  return round(sub + carriageReceived(po));
}
function invoicedNet(po){ return round(poInvoices(po).reduce((a,i)=>a+(+i.net||0),0)); }
function grni(po){ if(["draft","rejected","cancelled"].includes(po.status)) return 0; return Math.max(0, round(receivedNet(po) - invoicedNet(po))); }
function invoiceStatus(po){
  const n = poInvoices(po).length, inv = invoicedNet(po), rec = receivedNet(po), ord = orderNet(po);
  if(!n && !["ordered","partial","received","closed"].includes(po.status)) return null;
  const tol = Math.max(1, rec*0.005);
  if(!n) return rec > 0 ? {k:"none", label:"Not invoiced", c:"warn"} : {k:"notdue", label:"Not due yet", c:"neutral"};
  if(inv > rec + tol) return {k:"over", label:"Over-invoiced", c:"bad"};
  if(inv < rec - tol) return {k:"part", label:"Part invoiced", c:"warn"};
  return rec >= ord - tol ? {k:"full", label:"Fully invoiced", c:"ok"} : {k:"todate", label:"Invoiced to date", c:"ok"};
}
function invPill(po){ const s = invoiceStatus(po); return s ? `<span class="pill" style="color:var(--${s.c});background:var(--${s.c}-bg)">${s.label}</span>` : `<span class="sub">—</span>`; }
function receiptDate(po){ return po.firstReceivedAt || po.receivedAt || ""; }
function ageDays(d){ if(!d) return 0; return Math.max(0, Math.floor((Date.now() - new Date(d).getTime())/864e5)); }
function invoiceSection(p){
  const s = invoiceStatus(p), invs = poInvoices(p), g = grni(p), w = ME.canWrite, over = invoicedNet(p) - receivedNet(p);
  const msg = !s ? "" : { none:`Goods received but no invoice yet. ${money(g)} is in the GRNI report.`, part:`${money(g)} received but not yet invoiced, so it stays in the GRNI report.`, over:`Invoiced ${money(over)} more than the value received. Check with the vendor before paying.`, full:"Fully received and invoiced. Ready to close.", todate:"Invoices match what has arrived so far.", notdue:"Nothing received yet." }[s.k];
  return `<section class="section"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Receipts and invoices</h2>${invPill(p)}</div>
  <div class="match" style="margin-top:10px">
    <div><div class="k">Ordered (net)</div><div class="v">${money(orderNet(p))}</div></div>
    <div><div class="k">Received (net)</div><div class="v">${money(receivedNet(p))}</div></div>
    <div><div class="k">Invoiced (net)</div><div class="v">${money(invoicedNet(p))}</div></div>
    <div><div class="k">Received not invoiced</div><div class="v" style="${g?"color:var(--warn)":""}">${money(g)}</div></div>
  </div>
  ${msg?`<p style="margin:8px 0 0;font-weight:600;color:var(--${s.c==="neutral"?"muted":s.c})">${msg}</p>`:""}
  ${+p.shipping ? `<div class="row" style="margin-top:8px;gap:10px"><span class="sub">Carriage ${money(p.shipping)} counts as received</span>${w ? `<select class="search" style="flex:0 1 260px;min-width:200px;padding:5px 8px" data-carriage-po="${p.id}" aria-label="When carriage counts as received">${carriageOptions(p.carriage||"", `Default: ${CARRIAGE[(S.vendors[p.vendorId]||{}).carriage || cfg().carriage || "complete"].toLowerCase()}`)}</select>` : `<strong>${CARRIAGE[carriageRule(p)].toLowerCase()}</strong>`}<span class="sub">${money(carriageReceived(p))} counted so far (${carriageSource(p)})</span></div>` : ""}
  ${invs.length ? `<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Invoice</th><th>Date</th><th class="num">Net</th><th class="num">VAT</th><th class="num">Gross</th><th></th></tr></thead><tbody>${invs.map(i=>`<tr><td class="mono-id">${esc(i.number)}</td><td>${fmtDate(i.date)}</td><td class="num">${money(i.net)}</td><td class="num">${money(i.vat)}</td><td class="num">${money((+i.net||0)+(+i.vat||0))}</td><td class="num">${w&&i.id!=="legacy"?`<button class="icon-btn" data-action="del-invoice" data-id="${p.id}" data-inv="${i.id}" aria-label="Remove invoice ${esc(i.number)}">✕</button>`:""}</td></tr>`).join("")}</tbody></table></div>` : ""}
  </section>`;
}

/* ---------- Reports ---------- */
let LAST_REPORT = { name:"report", rows:[] };
function lineFacts(filterPo){
  const out = [];
  Object.values(S.pos).filter(filterPo).forEach(po => {
    const ls = po.lines||[], lnet = ls.map(l=>(+l.qty||0)*(+l.price||0)), tot = lnet.reduce((a,b)=>a+b,0) || 1;
    const rnet = ls.map(l=>(+l.received||0)*(+l.price||0)), rtot = rnet.reduce((a,b)=>a+b,0), g = grni(po), ship = +po.shipping||0;
    ls.forEach((l,i) => {
      const it = S.items[l.itemId];
      out.push({ po, l, it, net: lnet[i] + ship*lnet[i]/tot, outstanding: Math.max(0,(+l.qty||0)-(+l.received||0))*(+l.price||0), grni: rtot ? g*rnet[i]/rtot : 0,
        vendor: po.vendorId||"", nominal: l.nominal && S.nominals[l.nominal] ? l.nominal : "", dept: po.deptId||"", site: po.warehouseId && S.warehouses[po.warehouseId] ? po.warehouseId : "",
        plant: it && it.plantId && S.plants[it.plantId] ? it.plantId : "", part: it ? it.id : "", hire: l.hireId && S.hires[l.hireId] ? l.hireId : "", category: (it && it.category) || ((S.vendors[po.vendorId]||{}).category) || "", month: (po.createdAt||"").slice(0,7) });
    });
  });
  return out;
}
const DIMS = {

  plant:{ label:"Plant", name:id=>id?plantName(id):"Not plant-related", open:id=>id?`data-action="plant-select" data-plant="${id}"`:"" },
  site:{ label:"Site", name:id=>id?whName(id):"No site" },
  hire:{ label:"Hired vehicle", name:id=>id&&S.hires[id]?hireLabel(S.hires[id]):"Not hire-related", open:id=>id?`data-action="hire-open" data-id="${id}"`:"" },
  dept:{ label:"Department", name:id=>id?deptName(id):"—" },
  nominal:{ label:"Nominal code", name:id=>id?nominalLabel(id):"Not coded" },
  category:{ label:"Category", name:id=>id||"Uncategorised" },
  month:{ label:"Month", name:id=>id?new Date(id+"-01T00:00:00").toLocaleDateString(undefined,{month:"long",year:"numeric"}):"—" }

function groupFacts(facts, dim, field){
  const m = new Map();
  facts.forEach(f => { const k = f[dim]; const g = m.get(k) || { key:k, value:0, pos:new Set(), lines:0 }; g.value += f[field]; g.pos.add(f.po.id); g.lines++; m.set(k, g); });
  return [...m.values()].filter(g=>g.value>=0.005).sort((a,b)=> dim==="month" ? String(b.key).localeCompare(String(a.key)) : b.value-a.value);
}

}
function groupTable(groups, dim, valueLabel){

      <td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><span style="width:${(g.value/max*100).toFixed(1)}%;background:var(--brand)"></span></div><span class="sub" style="width:44px;text-align:right">${(g.value/total*100).toFixed(0)}%</span></div></td></tr>`; }).join("")}</tbody>
    <tfoot><tr><td>Total</td><td class="num">${new Set(groups.flatMap(g=>[...g.pos])).size}</td><td class="num">${groups.reduce((a,g)=>a+g.lines,0)}</td><td class="num">${money(groups.reduce((a,g)=>a+g.value,0))}</td><td></td></tr></tfoot></table></div>`;

function reportGrni(){
  const pos = Object.values(S.pos).filter(p=>grni(p)>0).sort((a,b)=>ageDays(receiptDate(b))-ageDays(receiptDate(a)));
  LAST_REPORT = { name:`grni-${UI.rg}`, rows:[] };
  const total = pos.reduce((a,p)=>a+grni(p),0);
  const b = [[0,30,"0–30 days"],[31,60,"31–60 days"],[61,90,"61–90 days"],[91,1e9,"Over 90 days"]].map(([lo,hi,l]) => [l, pos.filter(p=>{ const d = ageDays(receiptDate(p)); return d>=lo && d<=hi; }).reduce((a,p)=>a+grni(p),0)]);
  const kpis = `<div class="kpis"><div class="kpi" style="cursor:default"><div class="v">${money(total)}</div><div class="l">Received not invoiced · ${pos.length} order${pos.length===1?"":"s"}</div></div>${b.map(([l,v],i)=>`<div class="kpi ${i>=2&&v>0?"alert":""}" style="cursor:default"><div class="v">${money(v)}</div><div class="l">${l}</div></div>`).join("")}</div>`;

  if(UI.rg!=="po") return kpis + tools + groupTable(groupFacts(lineFacts(p=>grni(p)>0), UI.rg, "grni"), UI.rg, "GRNI");
  LAST_REPORT.rows = [["PO","Vendor","Department","Site","Nominal codes","First received","Age (days)","Received net","Invoiced net","GRNI","Invoice status"]].concat(pos.map(p=>[p.number, vendorName(p.vendorId), deptName(p.deptId), whName(p.warehouseId), [...new Set((p.lines||[]).map(l=>S.nominals[l.nominal]?S.nominals[l.nominal].code:"").filter(Boolean))].join(" "), (receiptDate(p)||"").slice(0,10), ageDays(receiptDate(p)), receivedNet(p).toFixed(2), invoicedNet(p).toFixed(2), grni(p).toFixed(2), (invoiceStatus(p)||{label:""}).label]));
  return kpis + tools + `<div class="table-wrap"><table><thead><tr><th>PO</th><th>Vendor</th><th>Department</th><th>Site</th><th>First received</th><th class="num">Age</th><th class="num">Received</th><th class="num">Invoiced</th><th class="num">GRNI</th><th>Invoice</th></tr></thead><tbody>${pos.map(p => { const d = ageDays(receiptDate(p)); return `
    <tr class="click" data-action="open-po" data-id="${p.id}" tabindex="0"><td class="mono-id">${esc(p.number)}</td><td>${esc(vendorName(p.vendorId))}</td><td>${esc(deptName(p.deptId))}</td><td>${esc(whName(p.warehouseId))}</td><td>${fmtDate(receiptDate(p))}</td>
    <td class="num" style="${d>60?"color:var(--bad);font-weight:600":""}">${d} days</td><td class="num">${money(receivedNet(p))}</td><td class="num">${money(invoicedNet(p))}</td><td class="num"><strong>${money(grni(p))}</strong></td><td>${invPill(p)}</td></tr>`; }).join("")}</tbody>
    <tfoot><tr><td colspan="6">Total</td><td class="num">${money(pos.reduce((a,p)=>a+receivedNet(p),0))}</td><td class="num">${money(pos.reduce((a,p)=>a+invoicedNet(p),0))}</td><td class="num">${money(total)}</td><td></td></tr></tfoot></table></div>`;
}
function reportOpen(){

  LAST_REPORT = { name:`open-orders-${UI.ro}`, rows:[] };

  if(UI.ro!=="po") return kpis + tools + groupTable(groupFacts(lineFacts(p=>st.includes(p.status)), UI.ro, "outstanding"), UI.ro, "Outstanding");
  LAST_REPORT.rows = [["PO","Vendor","Department","Site","Needed by","Ordered net","Received net","Outstanding","Status"]].concat(pos.map(p=>[p.number, vendorName(p.vendorId), deptName(p.deptId), whName(p.warehouseId), p.neededBy||"", orderNet(p).toFixed(2), receivedNet(p).toFixed(2), out(p).toFixed(2), STATUS[p.status].label]));
  return kpis + tools + `<div class="table-wrap"><table><thead><tr><th>PO</th><th>Vendor</th><th>Department</th><th>Site</th><th>Needed by</th><th class="num">Ordered</th><th class="num">Received</th><th class="num">Outstanding</th><th>Status</th></tr></thead><tbody>${pos.map(p=>`
    <tr class="click" data-action="open-po" data-id="${p.id}" tabindex="0"><td class="mono-id">${esc(p.number)}</td><td>${esc(vendorName(p.vendorId))}</td><td>${esc(deptName(p.deptId))}</td><td>${esc(whName(p.warehouseId))}</td><td ${overdue(p)?'style="color:var(--bad);font-weight:600"':""}>${fmtDate(p.neededBy)}</td><td class="num">${money(orderNet(p))}</td><td class="num">${money(receivedNet(p))}</td><td class="num"><strong>${money(out(p))}</strong></td><td>${pill(p.status)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="5">Total</td><td class="num">${money(pos.reduce((a,p)=>a+orderNet(p),0))}</td><td class="num">${money(pos.reduce((a,p)=>a+receivedNet(p),0))}</td><td class="num">${money(total)}</td><td></td></tr></tfoot></table></div>`;
}
function reportSpend(){
  const now = new Date(), y = String(now.getFullYear()), from12 = new Date(now.getFullYear(), now.getMonth()-11, 1).toISOString().slice(0,7);
  const inPeriod = d => UI.rperiod==="all" || (UI.rperiod==="ytd" ? year(d)===y : (d||"").slice(0,7) >= from12);
  const facts = lineFacts(p => COMMITTED.includes(p.status) && inPeriod(p.createdAt));
  LAST_REPORT = { name:`spend-${UI.rs}-${UI.rperiod}`, rows:[] };
  const tools = `<div class="toolbar">${dimSelect("rsDim", UI.rs, ["vendor","part","plant","hire","site","dept","nominal","category","month"])}
    <label class="row" style="gap:8px;font-size:13px;font-weight:600">Period<select id="rPeriod" class="search" style="min-width:140px;flex:none"><option value="ytd" ${UI.rperiod==="ytd"?"selected":""}>This year</option><option value="12m" ${UI.rperiod==="12m"?"selected":""}>Last 12 months</option><option value="all" ${UI.rperiod==="all"?"selected":""}>All time</option></select></label>
    <span class="sub">Approved orders, net of VAT, including shipping.</span></div>`;
  if(!facts.length) return tools + `<div class="panel empty"><strong>No spend in this period</strong>Approved orders will show here.</div>`;
  return tools + groupTable(groupFacts(facts, UI.rs, "net"), UI.rs, "Spend");
}
function viewReports(){
  const tabs = [["grni","Goods received not invoiced"],["open","Open orders"],["spend","Spend analysis"],["accounts","Accounts exports"],["audit","Audit trail"]];
  const body = UI.report==="open" ? reportOpen() : UI.report==="spend" ? reportSpend() : UI.report==="accounts" ? reportAccounts() : UI.report==="audit" ? reportAudit() : reportGrni();
  return header("Reports", "Interrogate receipts, invoices and spend by vendor, part, plant, site, department or nominal code.", `<button class="btn" data-action="report-csv">Export CSV</button>`) +
    `<div class="chips" role="tablist" style="margin-bottom:16px">${tabs.map(([k,l])=>`<button class="chip" role="tab" data-action="report-tab" data-tab="${k}" aria-pressed="${UI.report===k}">${l}</button>`).join("")}</div>` + body;
}

/* ---------- Vendors: supply, tendering, detail ---------- */
function hit(text, q){
  if(!q) return true;
  const t = String(text||"").toLowerCase();
  if(/[\d\s\-\/.]/.test(q)) return t.includes(q);
  const stem = q.length>3 && q.endsWith("s") ? q.slice(0,-1) : q;
  return t.split(/[^a-z0-9]+/).some(w => w.startsWith(q) || w.startsWith(stem));
}
function lastPaid(itemId, vendorId){
  let best = null;
  Object.values(S.pos).forEach(po => { if(po.vendorId!==vendorId || !COMMITTED.includes(po.status)) return; (po.lines||[]).forEach(l => { if(l.itemId===itemId && (!best || (po.createdAt||"") > best.at)) best = { price:+l.price||0, at:po.createdAt, po:po.number, poId:po.id }; }); });
  return best;
}
function itemSuppliers(it){
  const list = (it.suppliers||[]).filter(s=>S.vendors[s.vendorId]).map(s=>Object.assign({}, s));
  if(it.vendorId && S.vendors[it.vendorId] && !list.some(s=>s.vendorId===it.vendorId)) list.unshift({ vendorId:it.vendorId, price:+it.cost||0, lead:"", partNo:"" });
  list.forEach(s => { s.preferred = s.vendorId===it.vendorId; s.lastPaid = lastPaid(it.id, s.vendorId); });
  return list;
}
function vendorParts(vid){ return sortedItems().filter(it=>itemSuppliers(it).some(s=>s.vendorId===vid)); }
function tagStem(t){ t = String(t).toLowerCase().trim(); return t.length>3 && t.endsWith("s") ? t.slice(0,-1) : t; }
function possibleVendors(it){
  const have = new Set(itemSuppliers(it).map(s=>s.vendorId)), words = [it.category, it.name, compName(it)].join(" ").toLowerCase();
  return Object.values(S.vendors).filter(v => !have.has(v.id) && (v.supplies||[]).some(t => tagStem(t) && words.includes(tagStem(t)))).sort(byName);
}
function vendorMatchReasons(v, q){
  if(!q) return [];
  const r = [];
  if(hit(v.name,q) || hit(v.contact,q)) r.push("Name or contact");
  if(hit(v.category,q)) r.push(`Category: ${v.category}`);
  (v.supplies||[]).filter(t=>hit(t,q)).forEach(t=>r.push(`Supplies ${t}`));
  const parts = vendorParts(v.id).filter(it=>hit(it.name,q)||hit(it.sku,q)||hit(it.category,q)||hit(plantName(it.plantId),q)||hit(compName(it),q));
  if(parts.length) r.push(`Supplies ${parts.slice(0,2).map(it=>it.name).join(", ")}${parts.length>2?` and ${parts.length-2} more`:""}`);
  return r;
}
function vendorSpendYtd(vid){ const y = String(new Date().getFullYear()); return Object.values(S.pos).filter(p=>p.vendorId===vid && COMMITTED.includes(p.status) && year(p.createdAt)===y).reduce((a,p)=>a+orderNet(p),0); }
function tags(list, q){ return (list||[]).map(t=>`<span class="tag ${q&&hit(t,q)?"hit":""}">${esc(t)}</span>`).join(""); }
function viewVendors(){
  if(UI.vendorSel && S.vendors[UI.vendorSel]) return viewVendorDetail(S.vendors[UI.vendorSel]);
  UI.vendorSel = null;
  const w = ME.canWrite, q = UI.vq.trim().toLowerCase(), byPart = UI.vmode==="parts", vs = Object.values(S.vendors).sort(byName);
  const add = w ? `<button class="btn primary" data-action="vendor-form">Add vendor</button>` : "";
  if(!vs.length) return header("Vendors", "Suppliers you buy from.", add) + `<div class="panel empty"><strong>No vendors yet</strong>Add the suppliers you order from, and what they supply.</div>`;
  const toolbar = `<div class="toolbar"><input class="search" id="vendorSearch" type="search" placeholder="Search vendors, what they supply, parts or plants, e.g. belts" value="${esc(UI.vq)}" aria-label="Search vendors">
    <div class="chips"><button class="chip" data-action="vmode" data-mode="vendors" aria-pressed="${!byPart}">By vendor</button><button class="chip" data-action="vmode" data-mode="parts" aria-pressed="${byPart}">By part (tender view)</button></div></div>`;
  return header("Vendors", byPart ? "Every stock part with the vendors who supply it, their prices and lead times, so you can compare and go out to tender." : "Suppliers and what they supply. Search for something like belts to find everyone who supplies it.", add) + toolbar + (byPart ? vendorsByPart(q) : vendorsList(vs, q));
}
function vendorsList(vs, q){
  const rows = vs.map(v=>({ v, why:vendorMatchReasons(v,q) })).filter(x=>!q || x.why.length);
  if(!rows.length) return `<div class="table-wrap"><div class="empty"><strong>No vendors match</strong>No vendor name, supply category, part or plant matches “${esc(UI.vq)}”. Try the By part view, or a broader word.</div></div>`;
  return (q ? `<p class="sub" style="margin:-4px 0 10px">${rows.length} vendor${rows.length===1?"":"s"} supply or match “${esc(UI.vq)}”.</p>` : "") +
  `<div class="table-wrap"><table><thead><tr><th>Vendor</th><th>Supplies</th><th>Contact</th><th>Terms</th><th class="num">Parts</th><th class="num">Spend this year</th></tr></thead><tbody>${rows.map(({v,why}) => `
    <tr class="click" data-action="vendor-select" data-vendor="${v.id}" tabindex="0"><td><strong>${esc(v.name)}</strong><div class="sub">${esc(v.category||"")}</div>${why.length?`<div class="sub" style="color:var(--brand);font-weight:600">${esc(why.join(" · "))}</div>`:""}</td>
    <td style="max-width:320px">${tags(v.supplies, q) || `<span class="sub">Not set</span>`}</td><td>${esc(v.contact||"—")}<div class="sub">${esc([v.email,v.phone].filter(Boolean).join(" · "))}</div></td>
    <td>${esc(v.terms||"—")}</td><td class="num">${vendorParts(v.id).length}</td><td class="num">${money(vendorSpendYtd(v.id))}</td></tr>`).join("")}</tbody></table></div>`;
}
function supplierRows(it, cols, compact){
  const sups = itemSuppliers(it).sort((a,b)=>(+a.price||0)-(+b.price||0)), low = sups.length ? Math.min(...sups.map(s=>+s.price||0)) : 0;
  const rows = sups.map(s => {
    const v = S.vendors[s.vendorId], diff = low ? ((+s.price||0)-low)/low*100 : 0;
    return `<tr><td class="ind1"><button class="link-btn" data-action="vendor-select" data-vendor="${s.vendorId}">${esc(v.name)}</button> ${s.preferred?`<span class="tag">Preferred</span>`:""}${sups.length>1 && (+s.price||0)===low?`<span class="tag ok">Lowest price</span>`:""}${contractPrice(s.vendorId, it.id)?`<span class="tag">Contract ${esc(contractPrice(s.vendorId, it.id).c.ref)} ${money(contractPrice(s.vendorId, it.id).price)}</span>`:""}</td>
      <td class="num">${money(s.price)}</td><td class="num">${sups.length>1 ? (diff>0.05 ? `+${diff.toFixed(1)}%` : "—") : "—"}</td><td class="num">${s.lead?`${+s.lead} days`:"—"}</td>
      ${compact ? "" : `<td>${esc(s.partNo||"—")}</td>`}<td>${s.lastPaid?`${money(s.lastPaid.price)} <button class="link-btn sub" data-action="open-po" data-id="${s.lastPaid.poId}">${esc(s.lastPaid.po)}</button>`:`<span class="sub">${s.quotedAt?"Quoted "+fmtDate(s.quotedAt):"Never ordered"}</span>`}</td></tr>`;
  }).join("") || `<tr><td colspan="${cols}" class="sub ind1">No suppliers recorded yet.</td></tr>`;
  const poss = possibleVendors(it);
  return rows + (poss.length ? `<tr><td colspan="${cols}" class="sub ind1">Also supply this category, not yet quoted: ${poss.map(v=>`<button class="link-btn" data-action="vendor-select" data-vendor="${v.id}">${esc(v.name)}</button>`).join(", ")}</td></tr>` : "");
}
function vendorsByPart(q){
  const its = sortedItems().filter(it => !q || hit(it.name,q)||hit(it.sku,q)||hit(it.category,q)||hit(plantName(it.plantId),q)||hit(compName(it),q)||
    itemSuppliers(it).some(s=>hit(S.vendors[s.vendorId].name,q)));
  if(!its.length) return `<div class="table-wrap"><div class="empty"><strong>No parts match</strong>Try a different word.</div></div>`;
  const w = ME.canWrite;
  return `<div class="table-wrap"><table><thead><tr><th>Part · vendor</th><th class="num">Price</th><th class="num">Vs lowest</th><th class="num">Lead time</th><th>Vendor part no.</th><th>Last paid</th></tr></thead><tbody>${its.map(it => `
    <tr class="grp-plant"><td colspan="6"><div class="grp-plant-row"><button class="grp-toggle" data-action="open-item" data-id="${it.id}" style="font-size:15px">${esc(it.name)}</button><span class="sub">${esc(it.sku)}${it.plantId&&S.plants[it.plantId]?" · "+esc(plantName(it.plantId))+(compName(it)?" · "+esc(compName(it)):""):""}${stockOn() ? ` · ${onHand(it)} on hand${needsReorder(it)?` · <span style="color:var(--warn);font-weight:600">needs reorder</span>`:""}` : ""}</span>
      <span class="grp-right row" style="gap:6px">${w?`<button class="btn small" data-action="sup-manage" data-id="${it.id}">Suppliers</button>`:""}<button class="btn small primary" data-action="rfq" data-id="${it.id}">Request quotes</button></span></div></td></tr>
    ${supplierRows(it, 6, false)}`).join("")}</tbody></table></div>`;
}

/* ====================== People, roles, sign-in ====================== */
const ROLES = { request:"Raise orders", approve:"Value approval", code:"Coding approval", receive:"Receive goods and stock", invoice:"Invoices and accounts", admin:"Administrator" };
const SESSION_KEY = "po-desk-person";
const SESSION = { person: (() => { try { return localStorage.getItem(SESSION_KEY) || null; } catch(e){ return null; } })() };
function setSession(id){ SESSION.person = id; try { if(id) localStorage.setItem(SESSION_KEY, id); else localStorage.removeItem(SESSION_KEY); } catch(e){} }
function activePeople(){ return Object.values(S.people).filter(p=>p.active!==false).sort(byName); }
function peopleOn(){ return activePeople().some(p=>(p.roles||[]).includes("admin")); }
function me(){ const p = SESSION.person && S.people[SESSION.person]; return p && p.active!==false ? p : null; }
function actorId(){ const p = me(); return p ? p.id : (ME.id || null); }
function hasRole(r){ if(!peopleOn()) return true; const p = me(); if(!p) return false; const rs = p.roles||[]; return rs.includes(r) || (rs.includes("admin") && r!=="approve" && r!=="code"); }
function limitOf(p){ return p.limit==="" || p.limit==null ? Infinity : +p.limit; }
function approveCheck(po){
  if(!po) return { ok:false, why:"" };
  if(!peopleOn()) return { ok:true };
  const p = me(); if(!p || !hasRole("approve")) return { ok:false, why:"Needs the Value approval role" };
  if(cfg().sodRequester!==false && po.requesterId && po.requesterId===p.id) return { ok:false, why:"You raised this order, so someone else must approve it" };
  if(totals(po).total > limitOf(p)) return { ok:false, why:`Over your approval limit of ${money(limitOf(p))}` };
  return { ok:true };
}
function codeCheck(po){
  if(!po) return { ok:false, why:"" };
  if(!peopleOn()) return { ok:true };
  const p = me(); if(!p || !hasRole("code")) return { ok:false, why:"Needs the Coding approval role" };
  if(cfg().sodRequester!==false && po.requesterId && po.requesterId===p.id) return { ok:false, why:"You raised this order, so someone else must approve the coding" };
  return { ok:true };
}
function invoiceCheck(po){
  if(!peopleOn()) return { ok:true };
  const p = me(); if(!p || !hasRole("invoice")) return { ok:false, why:"Needs the Invoices and accounts role" };
  if(po && cfg().sodReceiver && (po.receivedBy||[]).includes(p.id)) return { ok:false, why:"You received the goods on this order, so someone else must record the invoice" };
  return { ok:true };
}
const ACTION_ROLE = { "new-po":"request","duplicate":"request","edit-po":"request","submit":"request","save-po":"request","reorder-item":"request","reorder-all":"request","save-reorder-all":"request","new-po-vendor":"request","withdraw":"request","cancel-po":"request","mark-sent":"request","send-po":"request","comms-log":"request","ack":"request","save-ack":"request","chase":"request",
  "tender-new":"request","save-tender":"request","tender-bid":"request","save-bid":"request","tender-award-mode":"request","tender-award-save":"request","tender-award-lowest":"request","tender-orders":"request","save-tender-orders":"request","tender-close":"request","rfq-save":"request","tender-invite-log":"request","hire-form":"request","save-hire":"request","hire-parts":"request","save-hire-parts":"request","hire-part-order":"request","hire-order":"request","hire-offhire":"request","save-offhire":"request","hire-onhire":"request","hire-cat-form":"admin","save-hire-cat":"admin","delete-hire-cat":"admin","delete-hire":"admin",
  "receive":"receive","save-receive":"receive","move-form":"receive","save-move":"receive",
  "del-invoice":"invoice","inv-import":"invoice","inv-import-go":"invoice","close-po":"invoice","ax-export":"invoice","ax-mark":"invoice","ax-grni":"invoice","ax-suppliers":"invoice",
  "vendor-form":"admin","save-vendor":"admin","item-form":"admin","save-item":"admin","plant-form":"admin","wh-form":"admin","dept-form":"admin","nominal-form":"admin","save-settings":"admin","sup-manage":"admin","save-suppliers":"admin","contract-form":"admin","save-contract":"admin","person-form":"admin","save-person":"admin","load-sample":"admin","clear-all":"admin","restore":"admin","ax-settings":"admin" };
function permPass(root){
  if(!peopleOn()) return;
  (root||document).querySelectorAll("button[data-action]").forEach(el => {
    const a = el.dataset.action, po = S.pos[el.dataset.id || (M && M.id)];
    let why = "";
    if(a==="approve"){ const c = approveCheck(po); if(!c.ok) why = c.why; }
    else if(a==="code-approve" || a==="save-coding"){ const c = codeCheck(po); if(!c.ok) why = c.why; }
    else if(a==="reject" && po){ const c = po.status==="coding" ? codeCheck(po) : approveCheck(po); if(!c.ok) why = c.why; }
    else if(a==="invoice" || a==="save-invoice"){ const c = invoiceCheck(po); if(!c.ok) why = c.why; }
    else if(ACTION_ROLE[a] && !hasRole(ACTION_ROLE[a])) why = `Needs the ${ROLES[ACTION_ROLE[a]]} role`;
    if(why){ el.disabled = true; el.title = why; el.classList.add("no-perm"); }
  });
}
async function pinHash(pid, pin){
  const s = `po-desk:${pid}:${pin}`;
  try { const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h = 2166136261; for(const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return "f" + h.toString(16); }
}

function ukDate(d){ if(!d) return ""; const [y,m,dd] = String(d).slice(0,10).split("-"); return `${dd}/${m}/${y}`; }
function firstOfNextMonth(d){ const [y,m] = String(d||today()).split("-").map(Number); return m===12 ? `${y+1}-01-01` : `${y}-${String(m+1).padStart(2,"0")}-01`; }
function dueDate(inv, po){ const v = S.vendors[po.vendorId]||{}, m = /(\d+)/.exec(v.terms||""), d = new Date((inv.date||today())+"T00:00:00"); d.setDate(d.getDate() + (m ? +m[1] : 0)); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function nominalByCode(code){ return Object.values(S.nominals).find(n=>String(n.code)===String(code)); }
function invoiceSplit(po, inv){
  const ls = po.lines||[]; let base = ls.map(l=>(+l.received||0)*(+l.price||0)), tot = base.reduce((a,b)=>a+b,0);
  if(!tot){ base = ls.map(l=>(+l.qty||0)*(+l.price||0)); tot = base.reduce((a,b)=>a+b,0) || 1; }
  const share = {}; ls.forEach((l,i)=>{ const k = l.nominal && S.nominals[l.nominal] ? S.nominals[l.nominal].code : ""; share[k] = (share[k]||0) + base[i]/tot; });
  const keys = Object.keys(share); let nA = 0, vA = 0;
  return keys.map((k,i) => { const last = i===keys.length-1, net = last ? round((+inv.net||0)-nA) : round((+inv.net||0)*share[k]), vat = last ? round((+inv.vat||0)-vA) : round((+inv.vat||0)*share[k]); nA += net; vA += vat; return { code:k, net, vat }; });
}

function grniJournalRows(fmt){

    return rows;
  }
  if(fmt==="sage"){

    sets.forEach(s => { lines.forEach(l => rows.push([s.sign>0?"JD":"JC", "", l.code, "", ukDate(s.date), s.ref, "Goods received not invoiced", l.amt.toFixed(2), "T9", "0.00"])); rows.push([s.sign>0?"JC":"JD", "", acc, "", ukDate(s.date), s.ref, "GRNI accrual", total.toFixed(2), "T9", "0.00"]); });

  sets.forEach(s => { lines.forEach(l => rows.push([s.date, s.ref, l.code, "Goods received not invoiced", s.sign>0?l.amt.toFixed(2):"", s.sign<0?l.amt.toFixed(2):""])); rows.push([s.date, s.ref, acc, "GRNI accrual", s.sign<0?total.toFixed(2):"", s.sign>0?total.toFixed(2):""]); });
  return rows;
}

/* ====================== Supplier comms: send, acknowledge, chase ====================== */
function ackState(p){
  if(!["ordered","partial"].includes(p.status)) return null;
  const due = (p.ack && p.ack.confirmed) || p.neededBy;
  if(due && due < today()) return { k:"late", label:`Delivery overdue since ${fmtDate(due)}`, c:"bad" };
  if(p.ack) return { k:"ok", label:`Acknowledged${p.ack.confirmed?` · due ${fmtDate(p.ack.confirmed)}`:""}`, c: p.ack.confirmed && p.neededBy && p.ack.confirmed > p.neededBy ? "warn" : "ok" };
  const d = ageDays(p.sentAt || p.approvedAt || p.updatedAt);
  return d >= 2 ? { k:"noack", label:`Not acknowledged after ${d} days`, c:"bad" } : { k:"wait", label:"Awaiting acknowledgement", c:"neutral" };
}
function supplierSection(p){
  if(p.status==="approved") return `<section class="section"><div class="banner row" style="justify-content:space-between;margin:0"><span>Approved and ready to send to ${esc(vendorName(p.vendorId))}.</span><button class="btn small primary" data-action="send-po" data-id="${p.id}">Send to vendor</button></div></section>`;
  const s = ackState(p); if(!s) return "";
  return `<section class="section"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Supplier confirmation</h2><span class="pill" style="color:var(--${s.c});background:var(--${s.c}-bg)">${s.label}</span></div>
    <p class="sub" style="margin:6px 0 8px">${[p.sentAt?`Sent ${fmtDateTime(p.sentAt)}`:"", p.ack?`Acknowledged ${fmtDate(p.ack.date)}${p.ack.ref?`, their ref ${esc(p.ack.ref)}`:""}`:"", p.chasedAt?`Last chased ${fmtDateTime(p.chasedAt)}`:""].filter(Boolean).join(" · ") || "Not yet confirmed by the vendor."}</p>
    <div class="row"><button class="btn small" data-action="ack" data-id="${p.id}">${p.ack?"Update confirmation":"Record acknowledgement"}</button><button class="btn small" data-action="chase" data-id="${p.id}">Chase vendor</button><button class="btn small" data-action="send-po" data-id="${p.id}">Resend order</button></div></section>`;
}

    const out = (p.lines||[]).filter(l=>(+l.received||0)<(+l.qty||0)).map(l=>`• ${l.desc}${l.sku?` (${l.sku})`:""}: ${(+l.qty||0)-(+l.received||0)} outstanding`).join("\n");

}

/* ====================== Invoice import ====================== */
function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q = false; } else cur += ch; }
    else if(ch==='"') q = true;
    else if(ch===','){ row.push(cur); cur = ""; }
    else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
function parseDateLoose(s){
  s = String(s||"").trim(); let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/.exec(s);
  if(m){ const y = m[3].length===2 ? "20"+m[3] : m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return "";
}
function numLoose(s){ const t = String(s==null?"":s).replace(/[£$€,\s]/g,""); return t==="" ? NaN : +t; }
function analyseImport(table){
  const head = table[0].map(h=>String(h).toLowerCase().trim()), find = f => head.findIndex(f);
  const ci = { po: find(h=>/(^|[^a-z])po([^a-z]|$)|order|purchase/.test(h) && !/date/.test(h)), inv: find(h=>/inv/.test(h) && !/date|po|order/.test(h)), date: find(h=>/date/.test(h)), net: find(h=>/net|ex.?vat|goods/.test(h)), vat: find(h=>/vat|tax/.test(h) && !/ex.?vat|net/.test(h)), gross: find(h=>/gross|total|inc/.test(h)) };
  const byNum = {}; Object.values(S.pos).forEach(p=>byNum[String(p.number).toLowerCase()] = p);
  const seen = new Set(), added = {};
  return { ci, rows: table.slice(1).map(r => {
    const poNo = String(r[ci.po]||"").trim(), invNo = String(r[ci.inv]||"").trim(), p = byNum[poNo.toLowerCase()];
    let net = ci.net>=0 ? numLoose(r[ci.net]) : NaN, vat = ci.vat>=0 ? numLoose(r[ci.vat]) : NaN;
    if(isNaN(net) && ci.gross>=0){ const g = numLoose(r[ci.gross]); if(!isNaN(g)){ const rate = p ? (+p.taxRate||0) : 20; net = isNaN(vat) ? round(g/(1+rate/100)) : round(g - vat); if(isNaN(vat)) vat = round(g - net); } }
    if(isNaN(vat)) vat = p && !isNaN(net) ? round(net*(+p.taxRate||0)/100) : 0;
    let status = "ok", note = "Matches";
    if(ci.po<0 || ci.inv<0) { status = "error"; note = "Couldn't find PO and invoice number columns"; }
    else if(!poNo || !p) { status = "error"; note = poNo ? `${poNo} not found` : "No PO number"; }
    else if(!invNo) { status = "error"; note = "No invoice number"; }
    else if(!(net>0)) { status = "error"; note = "No net amount"; }
    else if(["draft","pending","coding","rejected","cancelled"].includes(p.status)) { status = "error"; note = `${p.number} is ${STATUS[p.status].label.toLowerCase()}`; }
    else {
      const key = p.vendorId + "|" + invNo.toLowerCase();
      if(seen.has(key) || Object.values(S.pos).some(x=>x.vendorId===p.vendorId && poInvoices(x).some(i=>String(i.number||"").toLowerCase()===invNo.toLowerCase()))){ status = "error"; note = "Already recorded"; }
      seen.add(key);
      if(status==="ok"){ added[p.id] = (added[p.id]||0) + net; const over = invoicedNet(p) + added[p.id] - receivedNet(p); if(over > Math.max(1, receivedNet(p)*0.005)){ status = "warn"; note = `Over-invoices by ${money(over)}`; } }
    }
    return { poNo, invNo, date: parseDateLoose(r[ci.date]) || today(), net: isNaN(net)?0:round(net), vat: round(vat||0), p, status, note };
  }) };
}

async function runImport(){
  const ok = M.rows.filter(r=>r.status!=="error"), byPo = {};

}

/* ====================== Contracts ====================== */
function contractState(c){
  const t = today();
  if(c.start && t < c.start) return { k:"future", label:"Not started", c:"neutral" };
  if(c.end && t > c.end) return { k:"expired", label:"Expired", c:"bad" };
  const d = c.end ? Math.round((new Date(c.end+"T00:00:00") - new Date(t+"T00:00:00"))/864e5) : 9999;
  if(d <= 60) return { k:"expiring", label:`Ends in ${d} day${d===1?"":"s"}`, c:"warn" };
  return { k:"active", label:"Active", c:"ok" };
}
function activeContract(vid){ const t = today(); return Object.values(S.contracts).find(c => c.vendorId===vid && (!c.start || t>=c.start) && (!c.end || t<=c.end)); }
function contractPrice(vid, itemId){ const c = vid && activeContract(vid), x = c && (c.prices||[]).find(p=>p.itemId===itemId); return x ? { c, price:+x.price } : null; }
function contractSpend(c){ return Object.values(S.pos).filter(p=>p.contractId===c.id && COMMITTED.includes(p.status)).reduce((a,p)=>a+orderNet(p),0); }
function applyContract(po){ let n = 0; (po.lines||[]).forEach(l => { if(!l.itemId) return; const cp = contractPrice(po.vendorId, l.itemId); if(cp && +l.price!==cp.price){ l.price = cp.price; n++; } }); return n; }
function contractNote(po){
  const c = po.vendorId && activeContract(po.vendorId); if(!c) return "";
  const off = (po.lines||[]).filter(l => { const cp = l.itemId && contractPrice(po.vendorId, l.itemId); return cp && Math.abs((+l.price||0) - cp.price) > 0.005; });
  const sp = contractSpend(c);
  return `<div class="banner" style="margin-top:12px">Contract ${esc(c.ref)} · ${esc(c.title)} is active with ${esc(vendorName(c.vendorId))}${c.end?` until ${fmtDate(c.end)}`:""}. ${(c.prices||[]).length} contract price${(c.prices||[]).length===1?"":"s"} apply automatically. Spend so far ${money(sp)}${+c.cap?` of ${money(c.cap)}`:""}.${off.length?` <strong style="color:var(--warn)">${off.map(l=>esc(l.desc)).join(", ")} ${off.length===1?"is":"are"} priced differently from the contract.</strong>`:""}</div>`;
}

async function saveContract(){

  if(!c.vendorId) return err.textContent = "Choose the vendor.";
  if(c.start && c.end && c.end < c.start) return err.textContent = "The end date is before the start date.";
  const prices = c.prices.filter(p=>p.itemId).map(p=>({ itemId:p.itemId, price:round(+p.price||0) }));
  if(new Set(prices.map(p=>p.itemId)).size !== prices.length) return err.textContent = "Each item can only have one contract price.";

function tenderStatus(t){ return ({ open:{l:"Open",c:"info"}, awarded:{l:"Awarded",c:"ok"}, ordered:{l:"Ordered",c:"ok"}, closed:{l:"Closed",c:"neutral"} })[t.status||"open"]; }
function bidOf(t, vid, lid){ const x = ((t.bids||{})[vid]||{})[lid]; return x && x.price!=="" && x.price!=null ? x : null; }
function lowestBid(t, lid){ let best = null; (t.vendors||[]).forEach(vid => { const x = bidOf(t, vid, lid); if(x && (!best || +x.price < best.price)) best = { vid, price:+x.price }; }); return best; }
function tenderTotals(t){ return (t.vendors||[]).map(vid => { let total = 0, n = 0; (t.lines||[]).forEach(l => { const x = bidOf(t, vid, l.id); if(x){ total += (+x.price)*(+l.qty||0); n++; } }); return { vid, total:round(total), n }; }); }
function currentPrice(l){ const it = l.itemId && S.items[l.itemId]; if(!it) return null; const s = itemSuppliers(it).find(x=>x.preferred); return s ? +s.price : (+it.cost||null); }

function suggestedTenderVendors(lines){
  const ids = new Set();
  lines.forEach(l => { const it = l.itemId && S.items[l.itemId]; if(it){ itemSuppliers(it).forEach(s=>ids.add(s.vendorId)); possibleVendors(it).forEach(v=>ids.add(v.id)); } else if(l.desc){ Object.values(S.vendors).forEach(v => { if((v.supplies||[]).some(t=>String(l.desc).toLowerCase().includes(tagStem(t)))) ids.add(v.id); }); } });
  return ids;
}

async function saveAward(){
  const t = clone(S.tenders[UI.tenderSel]), awards = {};
  (t.lines||[]).forEach(l => { const r = document.querySelector(`input[name="aw-${l.id}"]:checked`); if(r) awards[l.id] = r.value; });
  if(!Object.keys(awards).length) return toast("Choose at least one winning bid.");
  const pref = $("#awPref") ? $("#awPref").checked : true;
  t.awards = awards; t.status = "awarded"; t.awardedAt = nowIso(); t.awardedBy = actorId();
  try { await put("tenders", t.id, t); } catch(e){ return; }
  const byItem = {};
  (t.lines||[]).forEach(l => { if(l.itemId && S.items[l.itemId]) (byItem[l.itemId] = byItem[l.itemId] || []).push(l); });
  for(const [iid, ls] of Object.entries(byItem)){
    const it = clone(S.items[iid]); const list = itemSuppliers(S.items[iid]).map(s=>({ vendorId:s.vendorId, price:s.price, lead:s.lead||"", partNo:s.partNo||"", quotedAt:s.quotedAt||"" }));
    ls.forEach(l => (t.vendors||[]).forEach(vid => { const x = bidOf(t, vid, l.id); if(!x) return; let row = list.find(r=>r.vendorId===vid); if(!row){ row = { vendorId:vid, partNo:"" }; list.push(row); } row.price = +x.price; row.lead = x.lead; row.quotedAt = (t.bids[vid]||{}).receivedAt || today(); }));
    it.suppliers = list;
    const won = ls.map(l=>awards[l.id]).find(Boolean); if(pref && won) it.vendorId = won;
    try { await put("items", iid, it); } catch(e){}
  }
  UI.tenderAward = false; UI.awardDraft = {};
  audit("Tender", t.id, "Awarded", Object.entries(awards).map(([lid,vid])=>`${(t.lines.find(l=>l.id===lid)||{}).desc}: ${vendorName(vid)}`).join("; "));
  render(); toast(`${t.ref} awarded. Bids saved as quotes on each part.`);
}

async function saveTenderOrders(){
  const dept = $("#toDept").value, wh = $("#toWh").value, t = clone(S.tenders[M.id]), c = cfg(), w = S.warehouses[wh];

      shipTo: w ? (w.address ? w.name+"\n"+w.address : w.name) : (c.shipTo||""), neededBy:t.requiredBy||"", notes:`Awarded under ${t.ref}`, taxRate:+c.tax||0, shipping:0,

function backupNote(){
  if(S.mode!=="local") return "";
  if(!Object.keys(S.pos).length && !Object.keys(S.items).length) return "";
  let lb = null; try { lb = localStorage.getItem("po-desk-lastbackup"); } catch(e){}
  const d = lb ? ageDays(lb) : null, bad = d===null || d>7;
  return `<div style="margin-top:6px;${bad?"color:var(--bad);font-weight:600":""}">Last backup: ${d===null?"never":d===0?"today":`${d} day${d===1?"":"s"} ago`}</div>`;
}
function storageUse(){ try { let n = 0; for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); n += (k.length + (localStorage.getItem(k)||"").length)*2; } return n; } catch(e){ return 0; } }

const RATE = { day:"per day", week:"per week", month:"per month" };
function sortedHireCats(){ return Object.values(S.hireCats).sort(byName); }
function hireClass(h){ const c = S.hireCats[h.catId]; return c ? (c.classes||[]).find(x=>x.id===h.classId) : null; }
function hireLabel(h){ return [h.fleetNo, [h.make, h.model].filter(Boolean).join(" ")].filter(Boolean).join(" · ") || h.ref || "Hire"; }
function hireMonthly(h){ if(h.status==="off") return 0; const r = +h.rate||0; return round(h.ratePeriod==="week" ? r*52/12 : h.ratePeriod==="day" ? r*365/12 : r); }
function hireState(h){
  if(h.status==="off") return { k:"off", label:`Off hired${h.offHireDate?" "+fmtDate(h.offHireDate):""}`, c:"neutral" };
  const t = today();
  if(h.start && t < h.start) return { k:"future", label:`Starts ${fmtDate(h.start)}`, c:"info" };
  if(h.end && t > h.end) return { k:"over", label:`Past agreed end, ${fmtDate(h.end)}`, c:"bad" };
  if(h.end){ const d = Math.round((new Date(h.end+"T00:00:00") - new Date(t+"T00:00:00"))/864e5); if(d <= 30) return { k:"ending", label:`Ends in ${d} day${d===1?"":"s"}`, c:"warn" }; }
  return { k:"on", label:"On hire", c:"ok" };
}
function hirePill(h, short){ const s = hireState(h), lbl = short ? ({ off:"Off hired", over:"Past end date", future:"Not started" }[s.k] || s.label) : s.label; return `<span class="pill" style="color:var(--${s.c});background:var(--${s.c}-bg)">${esc(lbl)}</span>`; }
function hireOrders(id){ return sortedPOs().filter(p=>(p.lines||[]).some(l=>l.hireId===id)); }

async function saveHire(){
  const h = M.h, err = $("#formErr");
  document.querySelectorAll("[data-hf]").forEach(el => { h[el.dataset.hf] = el.value.trim(); });
  if(!h.catId) return err.textContent = "Choose a category.";
  if(!h.classId) return err.textContent = "Choose a vehicle class.";
  if(!h.siteId || !S.warehouses[h.siteId]) return err.textContent = "Every hire must be assigned to a site.";
  if(!h.deptId || !S.depts[h.deptId]) return err.textContent = "Every hire must be assigned to a department.";
  if(!h.fleetNo && !h.make && !h.model) return err.textContent = "Enter a fleet number, registration or make and model.";
  if(!h.vendorId) return err.textContent = "Choose the hire company.";
  if(h.start && h.end && h.end < h.start) return err.textContent = "The agreed end is before the start.";
  if(h.fleetNo && Object.values(S.hires).some(x=>x.id!==M.id && x.status!=="off" && String(x.fleetNo).toLowerCase()===h.fleetNo.toLowerCase())) return err.textContent = `${h.fleetNo} is already on hire.`;
  const id = M.id || uid();
  if(!h.ref) h.ref = nextRef(S.hires, "H-");
  const rec = Object.assign({}, h, { rate: h.rate==="" ? 0 : round(+h.rate), parts: h.parts||[], status: h.status||"on" }); delete rec.id;
  try { await put("hires", id, rec); } catch(e){ return; }
  audit("Contract hire", id, M.id ? "Edited hire" : "Added hire", `${hireLabel(rec)} · ${whName(rec.siteId)} · ${deptName(rec.deptId)}`);
  closeModal(); toast(`${rec.fleetNo || rec.ref} saved`);
  if(!M || !M.id){ UI.view = "hire"; UI.hireSel = id; render(); }
}

/* ---------- Live presence and sharing ---------- */
let ROOM = null, PEERS = [], LAST_PRESENCE = "";
const VIEW_NAMES = { overview:"Overview", explore:"Explore", orders:"Purchase orders", approvals:"Approvals", receiving:"Receiving", tenders:"Tenders", hire:"Contract hire", stock:"Stock", plants:"Plants", warehouses:"Sites", vendors:"Vendors", contracts:"Contracts", reports:"Reports", budgets:"Budgets", nominals:"Nominal codes", people:"People", settings:"Settings" };
async function initRoom(){
  if(S.mode!=="shared" || ROOM) return;
  let room = null; try { room = await window.claude.use("room"); } catch(e){ room = null; }
  if(!room) return;
  ROOM = room;
  room.onPeers(ch => {
    PEERS = ch.peers.filter(p => p.kind==="viewer");
    const ids = [...new Set(PEERS.map(p=>p.by).filter(id => id && !(id in NAMES)))];
    if(userCap && ids.length) userCap.profiles(ids).then(ps => { ids.forEach(id => { NAMES[id] = (ps[id] && ps[id].name) || ""; }); renderPeers(); }).catch(()=>{});
    renderPeers();
  }, () => { ROOM = null; PEERS = []; renderPeers(); });
  LAST_PRESENCE = ""; pushPresence();
}
function pushPresence(){
  if(!ROOM) return;
  const p = me(), po = UI.openId && S.pos[UI.openId];
  const pres = { view: UI.view, person: p ? p.name : "", po: po ? po.number : null, plant: UI.plantSel && S.plants[UI.plantSel] ? S.plants[UI.plantSel].name : null };
  const key = JSON.stringify(pres); if(key===LAST_PRESENCE) return; LAST_PRESENCE = key;
  ROOM.presence(pres).catch(()=>{});
}
function peerName(pr){ const pres = pr.presence||{}; return String(pres.person || (pr.by && NAMES[pr.by]) || (pr.guest ? "Guest" : "Someone")); }
function peerWhere(pr){ const pres = pr.presence||{}; return [VIEW_NAMES[pres.view]||"", pres.po ? String(pres.po) : "", pres.plant ? String(pres.plant) : ""].filter(Boolean).join(" · "); }
function renderPeers(){
  const el = $("#liveBar"); if(!el) return;
  if(S.mode!=="shared"){ el.hidden = true; return; }
  el.hidden = false;
  const byPerson = new Map();
  PEERS.forEach(pr => { const k = pr.isMe ? "me" : (pr.by || pr.peer); if(!byPerson.has(k)) byPerson.set(k, pr); });
  const people = [...byPerson.values()].sort((a,b)=>(b.isMe?1:0)-(a.isMe?1:0));
  const others = people.filter(p=>!p.isMe);
  const initials = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "?";
  el.innerHTML = `<div class="live-head"><span class="live-dot" aria-hidden="true"></span><strong>Live</strong><span class="sub">${ROOM ? (others.length ? `${others.length} other${others.length===1?"":"s"} here now` : "Only you here now") : "Changes sync for everyone"}</span></div>
    ${people.length ? `<div class="peers">${people.map(pr => { const n = pr.isMe ? (me() ? me().name : "You") : peerName(pr); return `<span class="peer ${pr.isMe?"is-me":""}" title="${esc(n + (pr.isMe ? " (you)" : "") + (peerWhere(pr) ? " · " + peerWhere(pr) : ""))}">${esc(initials(n))}</span>`; }).join("")}</div>${others.length ? `<div class="sub peer-where">${others.slice(0,3).map(pr => `${esc(peerName(pr))}: ${esc(peerWhere(pr)||"browsing")}`).join("<br>")}</div>` : ""}` : ""}`;
}

  if(t.id==="rPeriod"){ UI.rperiod = t.value; render(); return; }
  if(M && M.kind==="suppliers" && t.name==="pref"){ M.pref = (M.list[+t.value]||{}).vendorId || ""; return; }
  if(t.id==="deptFilter"){ UI.sdept = t.value; render(); return; }
  if(t.id==="plantPick"){ UI.plantSel = t.value || null; render(); window.scrollTo(0,0); return; }
  if(t.id==="plantSiteFilter"){ UI.psite = t.value; UI.splant = "all"; render(); return; }
  if(M && M.kind==="item" && t.dataset.it==="plantId"){ const cs = document.querySelector('[data-it="componentId"]'); if(cs) cs.innerHTML = compOptions(t.value, ""); return; }
  if(M && M.kind==="move" && t.dataset.m){ M[t.dataset.m] = t.value; if(["type","itemId","from","to"].includes(t.dataset.m)) renderMoveForm(); return; }
  if(M && M.kind==="po" && t.dataset.f){
    M.po[t.dataset.f] = t.value;
    if(t.dataset.f==="warehouseId"){ const w = S.warehouses[t.value]; if(w && w.address){ M.po.shipTo = w.name + "\n" + w.address; const ta = document.querySelector('[data-f="shipTo"]'); if(ta) ta.value = M.po.shipTo; } }
    updateFormTotals();
  }
});
document.addEventListener("keydown", e => {
  if(e.key==="Enter" && e.target.id==="siPin"){ doSignIn(); return; }
  if(e.key==="Escape"){ if($("#modalRoot").innerHTML) closeModal(); else if(UI.openId || UI.openItem){ UI.openId=null; UI.openItem=null; render(); } }
  if(e.key==="Enter" && e.target.matches("tr[data-action]")){ e.target.click(); }
});

render();
boot();
})();
</script>
</body>
</html>
